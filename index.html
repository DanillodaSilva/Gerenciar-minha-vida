function carregar(){
  const bruto = localStorage.getItem(CHAVE);
  const { dados: d, migrou, deVersao } = Regras.migrar(bruto);
  if(migrou){
    const chaveBackup = 'backup_pre_v' + Regras.SCHEMA;
    if(deVersao < Regras.SCHEMA && localStorage.getItem(chaveBackup) === null) localStorage.setItem(chaveBackup, bruto);
    localStorage.setItem(CHAVE, JSON.stringify(d));
  }
  return d;
}
function salvar(){
  if(!dados) return;
  facVersao++;
  agendarReconciliacao();
  try{ localStorage.setItem(CHAVE, JSON.stringify(dados)); return true; }
  catch(e){ toast('Não consegui salvar 😕'); return false; }
}

function marcarItem(idItem, dia, valor){
  const lista = dados.feitos[dia] || [];
  const tem = lista.includes(idItem);
  if(valor === tem) return;
  dados.feitos[dia] = valor ? [...lista, idItem] : lista.filter(x => x !== idItem);
  if(!dados.feitos[dia].length) delete dados.feitos[dia];
}
const tarefaPorId = id => (dados.tarefas || []).find(t => t.id === id);
const secaoDe = id => dados.secoes.find(s => s.id === id);
function estaFeita(tipo, id){
  if(tipo === 'tarefa'){ const t = tarefaPorId(id); return !!(t && t.completedAt); }
  return feito(diaSel, id);
}
function definirFeita(tipo, id, valor){
  if(tipo === 'tarefa'){
    const t = tarefaPorId(id); if(!t) return;
    const agora = new Date().toISOString();
    t.completedAt = valor ? agora : null; t.updatedAt = agora;
    return;
  }
  marcarItem(id, diaSel, valor);
}

function verificarMarco(){
  const v = visao(), hj = hoje();
  const sequencia = Regras.sequencia(v, hj);
  const inicio = Regras.inicioSequencia(v, hj);
  const valor = Regras.marcoParaComemorar({ sequencia, inicioSequencia: inicio, ultimoMarco: dados.ajustes.ultimoMarco });
  if(!valor) return null;
  dados.ajustes.ultimoMarco = { inicio, valor };
  return { valor, recorde: sequencia >= Regras.maiorSequencia(v, hj) };
}

function comemorarDiaCompleto(total, depois){

document.addEventListener('pointerdown', e => { ultimoToque = { x: e.clientX, y: e.clientY, alvo: e.target }; if(dados && dados.ajustes.sons) Animacoes.prepararAudio(); }, true);
function onda(item, x, y){
  if(!item || Animacoes.reduzido()) return;
  const r = item.getBoundingClientRect();
  const lado = Math.hypot(Math.max(x - r.left, r.right - x), Math.max(y - r.top, r.bottom - y)) * 2;
  const el = document.createElement('span');
  el.className = 'onda';
  el.style.cssText = `width:${lado}px;height:${lado}px;left:${x - r.left - lado / 2}px;top:${y - r.top - lado / 2}px`;
  item.appendChild(el);
  el.animate([{ transform: 'scale(0.2)', opacity: 0.16 }, { transform: 'scale(1)', opacity: 0 }], { duration: Animacoes.MOV.onda, easing: Animacoes.MOV.saida })
    .onfinish = () => el.remove();
}
function marcarComToque(e, tipo, id){
  const item = e.currentTarget.closest('.item');
  const vaiMarcar = !estaFeita(tipo, id);
  const pt = ultimoToque && item && item.contains(ultimoToque.alvo) ? ultimoToque : null;
  concluirEntrada(tipo, id);
  if(vaiMarcar){
    const r = item && item.getBoundingClientRect();
    if(r) onda(item, pt ? pt.x : r.left + r.width / 2, pt ? pt.y : r.top + r.height / 2);
  }
}

const segurando = new Set();
const timersMarcar = new Map();
const ESPERA_CONCLUIDAS = Animacoes.MOV.esperaConcluidas;
function secaoDaEntrada(tipo, id){
  if(tipo === 'tarefa'){ const t = tarefaPorId(id); return t && secaoDe(t.categoryId); }
  return dados.secoes.find(s => s.itens.some(i => i.id === id));
}
function concluirEntrada(tipo, id){
  const dia = diaSel;
  const valor = !estaFeita(tipo, id);
  const s = secaoDaEntrada(tipo, id);
  const antesSecao = s && resumoDia(dia, s);
  const antesDia = resumoDia(dia);
  definirFeita(tipo, id, valor);
  const depoisDia = resumoDia(dia);
  const comemorarDia = valor && antesDia.feitas < antesDia.total && Regras.deveComemorarDia({ data: dia, hoje: hoje(), percentual: depoisDia.pct, ultimaComemoracao: dados.ajustes.ultimaComemoracao });
  if(comemorarDia) dados.ajustes.ultimaComemoracao = dia;
  const marco = valor ? verificarMarco() : null;
  salvar();
  const depoisSecao = s && resumoDia(dia, s);
  const secaoCompletou = valor && s && antesSecao.total && antesSecao.feitas < antesSecao.total && depoisSecao.feitas === depoisSecao.total;
  clearTimeout(timersMarcar.get(id));
  if(valor) segurando.add(id); else segurando.delete(id);
  render(false, valor);
  const noProximoQuadro = fn => requestAnimationFrame(() => requestAnimationFrame(fn));
  if(secaoCompletou) noProximoQuadro(() => comemorarSecao(s.id));
  if(comemorarDia) setTimeout(() => noProximoQuadro(() => comemorarDiaCompleto(depoisDia.total, marco ? () => comemorarMarco(marco) : null)), Animacoes.MOV.rapida);
  else if(marco) setTimeout(() => noProximoQuadro(() => comemorarMarco(marco)), Animacoes.MOV.rapida);
  if(valor && !comemorarDia && dados.ajustes.sons) Animacoes.tocar('tique');
  if(valor){
    if(!secaoCompletou && !comemorarDia) vibrar();
    snack('Tarefa concluída', () => { segurando.delete(id); const d0 = diaSel; diaSel = dia; definirFeita(tipo, id, false); diaSel = d0; salvar(); render(); });
    timersMarcar.set(id, setTimeout(() => {
      timersMarcar.delete(id);
      if(!segurando.has(id)) return;
      segurando.delete(id);
      const linha = document.querySelector(`#app .linha[data-id="${id}"]`);
      const fica = tela === 'secao';
      if(fica){ render(); return; }
      Animacoes.sair(linha, () => render());
    }, ESPERA_CONCLUIDAS));
  }
}
function apagarDeVez(tipo, id){
  if(tipo === 'tarefa'){ dados.tarefas = dados.tarefas.filter(t => t.id !== id); return; }
  dados.secoes.forEach(s => { s.itens = s.itens.filter(i => i.id !== id); });
  Object.keys(dados.feitos).forEach(d => {
    dados.feitos[d] = dados.feitos[d].filter(x => x !== id);
    if(!dados.feitos[d].length) delete dados.feitos[d];
  });
}
function excluirEntrada(tipo, id){
  ocultos.add(id); render();
  snack('Tarefa excluída',
    () => { ocultos.delete(id); render(); },
    () => { ocultos.delete(id); apagarDeVez(tipo, id); salvar(); render(); });
}
const alternar = idItem => concluirEntrada('item', idItem);

/* ---------- snackbar ---------- */
let snackAtual = null;
function esconderSnack(){
  const t = document.getElementById('toast');
  clearTimeout(t._h); t.classList.remove('show', 'com-acao');
}
function finalizarSnack(){
  const s = snackAtual; snackAtual = null; esconderSnack();
  if(s && s.aoExpirar) s.aoExpirar();
}
function desfazerSnack(){
  const s = snackAtual; snackAtual = null; esconderSnack();
  if(s && s.desfazer) s.desfazer();
}
function snack(msg, desfazer, aoExpirar){
  const t = document.getElementById('toast');
  const visivel = t.classList.contains('show');
  finalizarSnack();
  const duracao = desfazer ? Animacoes.MOV.desfazer : Animacoes.MOV.aviso;
  t.innerHTML = `<span>${esc(msg)}</span>` + (desfazer ? '<button class="snack-acao" onclick="desfazerSnack()">Desfazer</button><i class="barra" aria-hidden="true"></i>' : '');
  t.classList.toggle('com-acao', !!desfazer);
  void t.offsetHeight; t.classList.add('show');
  if(visivel && !Animacoes.reduzido()) t.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: Animacoes.MOV.base, easing: Animacoes.MOV.saida });
  const barra = t.querySelector('.barra');
  if(barra){
    if(Animacoes.reduzido()) barra.remove();
    else barra.animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(0)' }], { duration: duracao, easing: 'linear', fill: 'forwards' });
  }
  snackAtual = { desfazer, aoExpirar };
  t._h = setTimeout(finalizarSnack, duracao);
}
const toast = msg => snack(msg);

/* ---------- gestos: deslizar e toque longo ---------- */
let gesto = null, suprimirClique = false, menuAlvo = null;
function suprimirProximoClique(){ suprimirClique = true; setTimeout(() => { suprimirClique = false; }, Animacoes.MOV.toque); }
function fimGesto(){
  if(!gesto) return;
  clearTimeout(gesto.timer);
  gesto.linha.classList.remove('arrastando');
  gesto = null;
}
document.addEventListener('pointerdown', e => {
  const linha = e.target.closest('.linha');
  if(!linha || e.button > 0) return;
  const item = linha.querySelector('.item');
  item.getAnimations().forEach(a => { a.commitStyles(); a.cancel(); });
  gesto = { linha, item, x: e.clientX, y: e.clientY, dx: 0, dy: 0, modo: null, id: e.pointerId, amostras: [[e.timeStamp, e.clientX]], cruzou: false };
  gesto.timer = setTimeout(() => {
    if(gesto && !gesto.modo){ gesto.modo = 'longo'; suprimirClique = true; vibrar(); abrirMenu(linha.dataset, gesto.x, gesto.y); }
  }, 500);
});
document.addEventListener('pointermove', e => {
  if(!gesto || e.pointerId !== gesto.id || gesto.modo === 'longo') return;
  const dx = e.clientX - gesto.x, dy = e.clientY - gesto.y;
  if(!gesto.modo){
    if(Math.abs(dx) < Animacoes.GESTO.trava && Math.abs(dy) < Animacoes.GESTO.trava) return;
    clearTimeout(gesto.timer);
    if(Animacoes.decidirGesto({ dx, dy, largura: gesto.linha.offsetWidth }) === 'rolar'){ fimGesto(); return; }
    gesto.modo = 'desliza'; gesto.linha.classList.add('arrastando');
    try{ gesto.linha.setPointerCapture(e.pointerId); }catch(err){}
  }
  const largura = gesto.linha.offsetWidth;
  const podeDir = gesto.linha.dataset.concluivel === '1';
  gesto.dx = podeDir ? dx : Math.min(dx, 0);
  gesto.dy = dy;
  gesto.amostras.push([e.timeStamp, e.clientX]);
  if(gesto.amostras.length > 8) gesto.amostras.shift();
  gesto.item.style.transform = `translateX(${Animacoes.elastico(gesto.dx, largura)}px)`;
  if(gesto.dx > 0) gesto.linha.dataset.dir = 'dir';
  else if(gesto.dx < 0) gesto.linha.dataset.dir = 'esq';
  const cruzou = Math.abs(gesto.dx) >= largura * Animacoes.GESTO.limite;
  if(cruzou && !gesto.cruzou) vibrar(8);
  gesto.cruzou = gesto.cruzou || cruzou;
  gesto.linha.classList.toggle('cruzou', cruzou);
});
function velocidadeGesto(g){
  const recentes = g.amostras.filter(([t]) => t >= g.amostras[g.amostras.length - 1][0] - 100);
  if(recentes.length < 2) return 0;
  const [t0, x0] = recentes[0], [t1, x1] = recentes[recentes.length - 1];
  return t1 > t0 ? (x1 - x0) / (t1 - t0) : 0;
}
function voltarItem(g){
  const de = g.item.style.transform;
  g.item.style.transform = '';
  const limpar = () => { delete g.linha.dataset.dir; g.linha.classList.remove('cruzou'); };
  if(!de || Animacoes.reduzido()){ limpar(); return; }
  const a = g.item.animate([{ transform: de }, { transform: 'none' }], { duration: Animacoes.MOV.lenta, easing: Animacoes.curvaMola() });
  a.onfinish = limpar;
}
function soltar(e){
  if(!gesto || e.pointerId !== gesto.id) return;
  const g = gesto; fimGesto();
  if(g.modo === 'longo'){ suprimirProximoClique(); return; }
  if(g.modo !== 'desliza') return;
  suprimirProximoClique();
  const largura = g.linha.offsetWidth;
  const { tipo, id } = g.linha.dataset;
  const decisao = Animacoes.decidirGesto({ dx: g.dx, dy: 0, largura, velocidade: velocidadeGesto(g) });
  if(decisao === 'excluir'){
    const de = g.item.style.transform;
    g.item.style.transform = `translateX(${-largura}px)`;
    if(Animacoes.reduzido()){ excluirEntrada(tipo, id); return; }
    const a = g.item.animate([{ transform: de }, { transform: `translateX(${-largura}px)` }], { duration: Animacoes.MOV.base, easing: Animacoes.MOV.entrada });
    a.onfinish = () => excluirEntrada(tipo, id);
    return;
  }
  if(decisao === 'marcar') concluirEntrada(tipo, id);
  voltarItem(g);
}
document.addEventListener('pointerup', soltar);
document.addEventListener('pointercancel', e => {
  if(!gesto || e.pointerId !== gesto.id) return;
  const g = gesto; fimGesto();
  if(g.modo === 'desliza') voltarItem(g);
});

function abrirMenu(d, x, y){

  const marcar = d.concluivel === '1' ? `<button role="menuitem" onclick="menuAcao('concluir')">${ic('check')}${estaFeita(d.tipo, d.id) ? 'Desmarcar' : 'Marcar'}</button>` : '';
  const m = document.createElement('div');

  m.setAttribute('role', 'menu');

  m.innerHTML = `<p class="menu-tit" aria-hidden="true">${esc(nomeMenu)}</p>${marcar}
    <button role="menuitem" onclick="menuAcao('editar')">${ic('editar')}Editar</button>

  m._abridor = document.activeElement;

  if(o.data && t.dueDate) partes.push(`<span class="${Regras.atrasada(t, hoje()) ? 'passou' : ''}">${Regras.rotuloDia(t.dueDate, hoje())}</span>`);
  if(t.dueTime){
    const passou = t.dueDate === hoje() && !t.completedAt && t.dueTime < horaAgora();
    partes.push(passou ? `<span class="passou">${esc(t.dueTime)}, já passou</span>` : esc(t.dueTime));
  }
  if(o.secao && s) partes.push(`<span class="cat"><i class="ponto"></i>${esc(s.nome)}</span>`);
  if(t.priority === 'high') partes.push(`<span class="prio">${ic('bandeira','sm')}Alta</span>`);
  if(t.dueTime && t.reminderOffsetMin != null) partes.push(`<span class="rep">${ic('sino','sm')}<span class="sr">Com lembrete</span></span>`);
  return partes.length ? `<small>${partes.join(' · ')}</small>` : '';
}
function itemTarefa(t, o = {}){

const entradaFeita = e => !segurando.has(e.obj.id) && (e.tipo === 'item' ? feito(diaSel, e.obj.id) : !!e.obj.completedAt);
function itemHoje(s, i, comSecao, concluivel = true){

function telaHoje(){
  const r = resumoDia(diaSel);
  const ehHoje = diaSel === hoje();
  const vis = visao();
  const tarefasDia = vis.tarefas.filter(t => t.dueDate === diaSel);
  const atrasadas = ehHoje ? Regras.ordenarAtrasadas(vis.tarefas.filter(t => Regras.atrasada(t, diaSel))) : [];
  const grupos = [], concluidas = [];
  const montarGrupo = (s, entradas, cabecalho) => {
    const pendentes = entradas.filter(e => !entradaFeita(e));
    entradas.filter(entradaFeita).forEach(e => concluidas.push([s, e]));
    if(pendentes.length || (s && entradas.length)) grupos.push(cabecalho(pendentes));
  };
  dados.secoes.forEach(s => {
    const entradas = Regras.ordenarDia(Regras.ordenarItens(itensDoDia(diaSel, s)), tarefasDia.filter(t => t.categoryId === s.id));
    montarGrupo(s, entradas, pendentes => {
      const rs = resumoDia(diaSel, s);
      return `<section class="grupo tinta" data-chave="g-${s.id}" style="${tintaDe(s)}">
        <button class="grupo-top" onclick="abrirSecao('${s.id}')" aria-label="Abrir ${esc(s.nome)}, ${rs.feitas} de ${rs.total} feitas">
          <span class="emo" aria-hidden="true">${esc(s.emoji)}</span><span class="nm">${esc(s.nome)}</span><span class="cont">${rs.feitas} de ${rs.total}</span>${ic('proximo','sm')}
        </button>
        ${reordenando === s.id ? listaReordenar(s) : `${pendentes.length ? `<div class="lista">${pendentes.map(e => linhaEntrada(e, s, false)).join('')}</div>` : ''}
        ${linhaAdicao(s)}`}
      </section>`;
    });
  });
  const semSecao = tarefasDia.filter(t => !secaoDe(t.categoryId));
  montarGrupo(null, Regras.ordenarDia([], semSecao), pendentes => `<section class="grupo" data-chave="sem-secao">
      <h2 class="grupo-top"><span class="nm">Sem seção</span><span class="cont">${semSecao.filter(t => t.completedAt).length} de ${semSecao.length}</span></h2>
      <div class="lista">${pendentes.map(e => linhaEntrada(e, null, false)).join('')}</div>
    </section>`);
  const blocoAtrasadas = atrasadas.length ? `<section class="grupo" data-chave="atrasadas">
      <h2 class="grupo-top"><span class="nm">Atrasadas</span><span class="cont">${atrasadas.length}</span></h2>
      <div class="lista">${atrasadas.map(t => itemTarefa(t, { data: true, secao: true })).join('')}</div>
    </section>` : '';
  concluidas.sort(([, a], [, b]) => (a.tipo === 'tarefa') - (b.tipo === 'tarefa') || String(b.obj.completedAt || '').localeCompare(String(a.obj.completedAt || '')));
  let corpo;
  if(!r.total){
    corpo = blocoAtrasadas + `<div class="vazio" data-chave="vazio">${ILUSTRA.dia}<h2>${ehHoje ? 'Nenhuma tarefa para hoje.' : 'Nenhuma tarefa neste dia.'}</h2><p>Adicione o que você quer fazer e acompanhe aqui.</p>
      <button class="btn" onclick="novaTarefa()">Adicionar tarefa</button></div>`;
  } else {
    const tudo = r.feitas === r.total ? `<div class="vazio tudo-feito" data-chave="tudo-feito" role="status">${ic('hoje','lg')}<p><b>${ehHoje ? 'Tudo feito por hoje' : 'Tudo feito neste dia'}</b><br><small>${r.feitas} de ${r.total} concluídas</small></p></div>` : '';
    const listaConcl = concluidas.length ? `<section class="grupo" data-chave="concluidas">
      <button class="grupo-top" aria-expanded="${concluidasAbertas}" onclick="concluidasAbertas=!concluidasAbertas;render()">
        <span class="nm">Concluídas (${concluidas.length})</span>${ic('expandir','sm')}
      </button>
      ${concluidasAbertas ? `<div class="lista">${concluidas.map(([s, e]) => linhaEntrada(e, s, true)).join('')}</div>` : ''}
    </section>` : '';
    corpo = tudo + blocoAtrasadas + grupos.join('') + listaConcl;
  }
  const fz = festaAtual(), fzAuge = !!fz && fz.fase === 'auge';
  return `
    <header class="hoje-top${fz ? ' festa-' + fz.fase : ''}" data-desenho="${esc(chaveDesenho())}" data-periodo="${Regras.periodo(horaAgora())}">
      <span class="ceu manha" aria-hidden="true"></span><span class="ceu tarde" aria-hidden="true"></span><span class="ceu noite" aria-hidden="true"></span>
      ${fzAuge ? decoDe(fz, 'auge') : ''}
      <div class="hoje-tit">
        <div class="hoje-data">
          <span>${ehHoje ? Regras.dataExtenso(diaSel) : Regras.rotuloDia(diaSel, hoje()) === 'Ontem' ? 'Ontem · ' + Regras.dataExtenso(diaSel) : Regras.dataExtenso(diaSel)}</span>
          <span class="setas">
            <button class="icon-btn" onclick="mudarDia(-1)" aria-label="Dia anterior">${ic('anterior')}</button>
            <button class="icon-btn" onclick="mudarDia(1)" ${ehHoje ? 'disabled' : ''} aria-label="Próximo dia">${ic('proximo')}</button>
          </span>
        </div>
        <h1>${esc(fzAuge ? Festas.saudacaoFesta(fz, hojeFesta(), dados.ajustes.nome) : Regras.saudacao(horaAgora(), dados.ajustes.nome))}${fzAuge && fz.id === 'ano-novo' && hojeFesta().endsWith('-01-01') && Animacoes.reduzido() ? SVG('0 0 24 24', `<path d="${FAISCA}" fill="var(--festa-1)"/>`, 'festa-estrela-h1') : ''}</h1>
        ${fzAuge ? `<p class="saud-hora">${esc(Regras.saudacao(horaAgora(), dados.ajustes.nome))}</p>` : ''}
        <p class="frase" aria-live="polite">${Regras.fraseProgresso({ feitos: r.feitas, total: r.total, ehHoje })}</p>
        ${fz && fz.fase === 'chegando' ? chipFesta(fz) : ''}
      </div>
      ${anel(r.feitas, r.total)}
    </header>
    ${faixaSemana()}
    ${cartaoFestivo(fz)}
    ${cartaoRetro()}
    ${cartoesFaculdadeHoje()}
    ${corpo}
    <button class="btn text nova-secao" data-chave="nova-secao" onclick="sheetSecao()">${ic('add')} Nova seção</button>
    <button class="fab" onclick="novaTarefa()">${ic('add')}<span>Nova tarefa</span></button>
  `;
}

function listaProximos(){
  let ts = visao().tarefas.map(t => segurando.has(t.id) ? { ...t, completedAt: null } : t);

  else if(filtroProx !== 'todas') ts = ts.filter(t => t.categoryId === filtroProx);

    const r = Regras.buscarTarefas(ts, busca);
    return r.length ? `<section class="grupo" data-chave="resultados"><h2 class="grupo-top"><span class="nm">Resultados</span><span class="cont">${r.length}</span></h2>
      <div class="lista">${r.map(t => itemTarefa(t, { data: true, secao: true })).join('')}</div></section>`
      : '<div class="vazio"><p>Nenhuma tarefa encontrada.</p></div>';

  const g = Regras.gruposProximos(ts, hoje());
  if(!g.length) return `<div class="vazio" data-chave="vazio">${ILUSTRA.futuro}<h2>Nada planejado para os próximos dias.</h2><p>Tarefas com data futura aparecem aqui.</p><button class="btn" onclick="novaTarefaSemData()">Adicionar tarefa</button></div>`;
  return g.map(x => `<section class="grupo" data-chave="p-${x.chave}"><h2 class="grupo-top"><span class="nm">${esc(x.titulo)}</span></h2>
    <div class="lista">${x.tarefas.map(t => itemTarefa(t, { data: x.chave === 'depois', secao: true })).join('')}</div></section>`).join('');
}

let progressoAnimado = false;
function animarProgresso(){
  if(progressoAnimado || tela !== 'constancia') return;
  const barras = document.querySelectorAll('#app .chart.semana .b');
  if(!barras.length) return;
  progressoAnimado = true;
  if(Animacoes.reduzido()) return;
  const M = Animacoes.MOV;
  barras.forEach((b, i) => b.animate([{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], { duration: M.lenta, delay: i * M.cascataBarras, easing: M.saida, fill: 'backwards' }));
  document.querySelectorAll('#app .cartao-num [data-contar], #app .total-card [data-contar]').forEach(el => { el._mostrado = 0; Animacoes.contar(el); });
}
function balaoBarra(col, dia){
  const r = Regras.resumoDia(visao(), dia);
  const nome = Regras.DIAS_LONGOS[(Regras.parseDia(dia).getDay() + 6) % 7];
  const texto = `${nome}, ${r.feitas} de ${r.total} feitos`;
  document.querySelectorAll('.balao').forEach(b => b.remove());
  const b = document.createElement('span');
  b.className = 'balao'; b.setAttribute('role', 'status'); b.textContent = texto;
  col.appendChild(b);
  const lado = col.getBoundingClientRect(), larg = b.offsetWidth, margem = 8;
  const deslocamento = Math.min(0, innerWidth - margem - (lado.left + lado.width / 2 + larg / 2)) + Math.max(0, margem - (lado.left + lado.width / 2 - larg / 2));
  b.style.transform = `translateX(calc(-50% + ${deslocamento}px))`;
  if(!Animacoes.reduzido()) b.animate([{ opacity: 0 }, { opacity: 1 }], { duration: Animacoes.MOV.rapida, easing: Animacoes.MOV.saida });
  setTimeout(() => {
    if(!b.isConnected) return;
    if(Animacoes.reduzido()) return b.remove();
    b.animate([{ opacity: 1 }, { opacity: 0 }], { duration: Animacoes.MOV.rapida, easing: Animacoes.MOV.entrada, fill: 'forwards' }).onfinish = () => b.remove();
  }, Animacoes.MOV.balao);
}
function telaProgresso(){
  const vis = visao();
  const total = Regras.totalConcluidas(vis);
  if(!total) return `<header class="top"><h1>Progresso</h1></header>
    <div class="vazio" data-chave="vazio">${ILUSTRA.grafico}<h2>Conclua sua primeira tarefa para ver seu progresso.</h2><p>Sua sequência e sua semana aparecem aqui.</p><button class="btn" onclick="irPara('rotina')">Ir para Hoje</button></div>`;

  const seq = Regras.sequencia(vis, hoje());
  const taxa = Regras.taxaSemana(vis, hoje());
  const semana = Regras.barrasSemana(vis, hoje());
  const maxSemana = Math.max(1, ...semana.map(b => b.valor));
  const letras = ['S','T','Q','Q','S','S','D'];
  const barrasSemana = semana.map((b, i) => `
    <button class="col" aria-label="${Regras.DIAS_LONGOS[i]}, ${b.valor} ${b.valor === 1 ? 'tarefa concluída' : 'tarefas concluídas'}" onclick="balaoBarra(this, '${b.dia}')">
      <span class="valor" aria-hidden="true">${b.valor}</span>
      <div class="b ${b.valor ? '' : 'zero'} ${b.hoje ? 'hoje' : ''}" style="height:${b.valor / maxSemana * 100}%"></div>
      <div class="lbl ${b.hoje ? 'hoje' : ''}" aria-hidden="true">${letras[i]}</div>
    </button>`).join('');

  const dias = [];
  for(let i = periodo - 1; i >= 0; i--) dias.push(somaDias(hoje(), -i));
  const resumos = dias.map(d => ({ d, ...resumoDia(d) }));
  const comTarefa = resumos.filter(r => r.total);
  const tot = comTarefa.reduce((a,r) => a + r.total, 0);
  const fei = comTarefa.reduce((a,r) => a + r.feitas, 0);
  const media = tot ? Math.round(fei / tot * 100) : 0;
  const melhor = comTarefa.length ? Math.max(...comTarefa.map(r => r.pct)) : 0;
  const passo = periodo > 14 ? 5 : 1;
  const barras = resumos.map((r, idx) => `
    <div class="col" role="img" aria-label="${Regras.dataCurta(r.d)}, ${r.total ? r.pct + '%' : 'sem tarefas'}">
      <div class="b ${r.pct ? '' : 'zero'}" style="height:${r.pct}%">
        ${periodo <= 14 && r.total ? `<span aria-hidden="true">${r.pct}%</span>` : ''}
      </div>
      <div class="lbl" aria-hidden="true">${(idx % passo === 0 || idx === resumos.length - 1) ? curto(r.d) : '&nbsp;'}</div>
    </div>`).join('');
  const porSecao = dados.secoes.map(s => {
    let t = 0, fe = 0;
    dias.forEach(d => { const r = resumoDia(d, s); t += r.total; fe += r.feitas; });
    const p = t ? Math.round(fe / t * 100) : 0;
    return `<div class="secstat" style="--c:${corDe(s)}">
      <div class="top"><span>${esc(s.emoji)} ${esc(s.nome)}</span><b>${p}%</b></div>
      <div class="bar"><i style="--p:${p / 100}"></i></div>
    </div>`;
  }).join('');

  return `
    <header class="top"><h1>Progresso</h1></header>
    <div class="cartoes">
      <div class="cartao-num destaque">${ic('fogo')}<b data-contar="${seq}" data-duracao="600">${seq}</b><span>${Regras.textoSequencia(seq)}</span></div>
      <div class="cartao-num">${ic('grafico')}<b ${taxa.pct === null ? '' : `data-contar="${taxa.pct}" data-sufixo="%" data-duracao="600"`}>${taxa.pct === null ? '—' : taxa.pct + '%'}</b><span>${Regras.textoTaxa(taxa.pct)}</span></div>
    </div>
    <div class="card">
      <h2>Concluídas por dia nesta semana</h2>
      <div class="chart semana">${barrasSemana}</div>
    </div>
    <div class="card total-card"><span>Concluídas no total:</span><b data-contar="${total}" data-duracao="600">${total}</b></div>

    <h2 class="titulo-bloco">Histórico</h2>
    <div class="seg" role="radiogroup" aria-label="Período">
      ${[7,30,90].map(p => `<button role="radio" aria-checked="${p===periodo}" class="${p===periodo?'on':''}" onclick="periodo=${p};render()">${p} dias</button>`).join('')}
    </div>
    <div class="summary">
      <small>Nos últimos ${periodo} dias você cumpriu</small>
      <div class="big">${media}%</div>
      <small>${fei} de ${tot} tarefas</small>
      <div class="bar"><i style="--p:${media / 100}"></i></div>
    </div>
    <div class="stats dois">
      <div class="stat"><b>${resumoDia(hoje()).pct}%</b><small>hoje</small></div>
      <div class="stat"><b>${melhor}%</b><small>melhor dia</small></div>
    </div>
    <div class="card">
      <h2>Dia a dia</h2>
      <div class="chart">${barras}</div>
    </div>
    <div class="card">
      <h2>Por seção</h2>
      ${porSecao}
    </div>
  `;
}

function telaAjustes(){
  const tema = dados.ajustes.tema;
  const opcao = (id, rotulo) => `<button class="opcao" role="radio" aria-checked="${tema === id}" onclick="mudarTema('${id}')"><span class="radio"></span>${rotulo}</button>`;
  const secoes = dados.secoes.map(s => {

/* ---------- janelas (bottom sheets) ---------- */
const ALCA = '<div class="alca" aria-hidden="true"></div>';
let abridorFolha = null;
function animarFolha(entrar){
  const sh = $('sheet'), veu = document.querySelector('#overlay .veu');
  const M = Animacoes.MOV, red = Animacoes.reduzido();
  const de = sh.style.transform || (entrar ? 'translateY(100%)' : 'none');
  const opDe = veu.style.opacity !== '' ? Number(veu.style.opacity) : (entrar ? 0 : 1);
  sh.style.transform = ''; veu.style.opacity = '';
  [sh, veu].forEach(el => el.getAnimations().forEach(a => a.cancel()));
  if(red){
    const o = entrar ? [{ opacity: 0 }, { opacity: 1 }] : [{ opacity: 1 }, { opacity: 0 }];
    return [sh.animate(o, { duration: M.reduzida, fill: 'forwards' }), veu.animate(o, { duration: M.reduzida, fill: 'forwards' })];
  }
  if(entrar) return [
    sh.animate([{ transform: de }, { transform: 'none' }], { duration: M.lenta, easing: Animacoes.curvaMola() }),
    veu.animate([{ opacity: opDe }, { opacity: 1 }], { duration: M.base, easing: M.saida }),
  ];
  return [
    sh.animate([{ transform: de }, { transform: 'translateY(100%)' }], { duration: M.base, easing: M.entrada, fill: 'forwards' }),
    veu.animate([{ opacity: opDe }, { opacity: 0 }], { duration: M.base, easing: M.entrada, fill: 'forwards' }),
  ];
}
function encolherFab(encolher){
  const fab = document.querySelector('#app .fab');
  if(!fab) return;
  fab.getAnimations().forEach(a => a.cancel());
  if(Animacoes.reduzido()){ fab.style.visibility = encolher ? 'hidden' : ''; return; }
  fab.style.visibility = '';
  fab.animate(encolher ? [{ transform: 'none', opacity: 1 }, { transform: 'scale(0.9)', opacity: 0 }] : [{ transform: 'scale(0.9)', opacity: 0 }, { transform: 'none', opacity: 1 }],
    { duration: encolher ? Animacoes.MOV.rapida : Animacoes.MOV.base, easing: encolher ? Animacoes.MOV.entrada : Animacoes.MOV.saida, fill: encolher ? 'forwards' : 'none' });
}
function abrirSheet(html, cheia = false){
  const ov = $('overlay'), sh = $('sheet');
  const reabrindo = ov.classList.contains('saindo');
  ov.classList.remove('saindo');
  sh.classList.toggle('cheia', cheia);
  sh.innerHTML = ALCA + html;
  if(!reabrindo){
    const tocado = ultimoToque && ultimoToque.alvo && ultimoToque.alvo.closest && ultimoToque.alvo.closest('button, [tabindex]');
    abridorFolha = tocado || document.activeElement;
  }
  ov.classList.add('show');
  document.documentElement.classList.add('travado');
  history.pushState({sheet:true}, '');
  animarFolha(true);
  if(abridorFolha && abridorFolha.classList && abridorFolha.classList.contains('fab')) encolherFab(true);
  const primeiro = document.querySelector('#sheet input');
  if(primeiro && !primeiro.value) setTimeout(() => primeiro.focus(), 80);
  else setTimeout(() => { if(!sh.contains(document.activeElement)){ const b = document.querySelector('#sheet button, #sheet input, #sheet textarea'); if(b) b.focus({ preventScroll: true }); } }, 80);
}
function fecharSheet(vindoDoVoltar){
  const ov = $('overlay'), sh = $('sheet');
  if(!ov.classList.contains('show')){ if(!vindoDoVoltar){ ignorarPop = true; history.back(); } return; }
  ov.classList.remove('show');
  ov.classList.add('saindo');
  const anims = animarFolha(false);
  const abridor = abridorFolha;
  Promise.all(anims.map(a => a.finished.catch(() => {}))).then(() => {
    if(ov.classList.contains('show')) return;
    ov.classList.remove('saindo');
    sh.classList.remove('cheia');
    [sh, document.querySelector('#overlay .veu')].forEach(el => el.getAnimations().forEach(a => a.cancel()));
    document.documentElement.classList.remove('travado');
    encolherFab(false);
    if(abridor && abridor.isConnected && typeof abridor.focus === 'function') abridor.focus({ preventScroll: true });
  });
  if(!vindoDoVoltar){ ignorarPop = true; history.back(); }
}
let arrasteFolha = null;
document.addEventListener('pointerdown', e => {
  const sh = $('sheet');
  if(!$('overlay').classList.contains('show') || !sh.contains(e.target) || e.button > 0) return;
  if(e.target.closest('input, textarea, select')) return;
  const topo = sh.getBoundingClientRect().top;
  if(!e.target.closest('.alca') && e.clientY - topo > parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--zona-arrasto'))) return;
  arrasteFolha = { y: e.clientY, x: e.clientX, dy: 0, ativo: false, id: e.pointerId, amostras: [[e.timeStamp, e.clientY]] };
});
document.addEventListener('pointermove', e => {
  const a = arrasteFolha;
  if(!a || e.pointerId !== a.id) return;
  const dy = e.clientY - a.y, dx = e.clientX - a.x;
  if(!a.ativo){
    if(Math.abs(dy) < Animacoes.GESTO.trava && Math.abs(dx) < Animacoes.GESTO.trava) return;
    if(Math.abs(dx) > Math.abs(dy)){ arrasteFolha = null; return; }
    a.ativo = true;
    try{ $('sheet').setPointerCapture(e.pointerId); }catch(err){}
  }
  a.dy = dy > 0 ? dy : dy * Animacoes.GESTO.resistencia;
  a.amostras.push([e.timeStamp, e.clientY]); if(a.amostras.length > 8) a.amostras.shift();
  const sh = $('sheet');
  sh.getAnimations().forEach(x => x.cancel());
  sh.style.transform = `translateY(${a.dy}px)`;
  document.querySelector('#overlay .veu').style.opacity = String(Math.max(0, 1 - Math.max(0, a.dy) / sh.offsetHeight));
});
document.addEventListener('pointerup', e => {
  const a = arrasteFolha;
  if(!a || e.pointerId !== a.id) return;
  arrasteFolha = null;
  if(!a.ativo) return;
  suprimirProximoClique();
  const sh = $('sheet');
  const rec = a.amostras.filter(([t]) => t >= a.amostras[a.amostras.length - 1][0] - 100);
  const v = rec.length > 1 ? (rec[rec.length - 1][1] - rec[0][1]) / Math.max(1, rec[rec.length - 1][0] - rec[0][0]) : 0;
  if(a.dy > sh.offsetHeight * 0.3 || v > Animacoes.GESTO.velocidade){
    pedirFechar();
    if(!$('overlay').classList.contains('show')) return;
  }
  animarFolha(true);
});
document.addEventListener('pointercancel', e => { if(arrasteFolha && e.pointerId === arrasteFolha.id){ arrasteFolha = null; animarFolha(true); } });
document.addEventListener('keydown', e => {
  if(e.key !== 'Tab' || !$('overlay').classList.contains('show') || $('dialogo').classList.contains('show')) return;
  const focaveis = [...$('sheet').querySelectorAll('button:not([disabled]), input:not([type="date"]), textarea, select, [tabindex]:not([tabindex="-1"])')].filter(el => el.offsetParent !== null);
  if(!focaveis.length) return;
  const [prim, ult] = [focaveis[0], focaveis[focaveis.length - 1]];
  if(e.shiftKey && document.activeElement === prim){ e.preventDefault(); ult.focus(); }
  else if(!e.shiftKey && document.activeElement === ult){ e.preventDefault(); prim.focus(); }
  else if(!$('sheet').contains(document.activeElement)){ e.preventDefault(); prim.focus(); }
});

document.getElementById('arquivo').addEventListener('change', async e => {

  let novo, fotos;
  try{ ({ dados: novo, fotos } = Regras.lerBackupCompleto(await f.text())); }
  catch(err){ toast('Arquivo de backup inválido.'); return; }
  const atuais = Regras.contarTarefas(dados), doBackup = Regras.contarTarefas(novo);

async function exportarComFotos(){
  finalizarSnack();
  let fotos;
  try{ const refs = fotosReferenciadas(); fotos = (await Fotos.todos()).filter(x => refs.has(x.id)); }
  catch(e){ return toast('Não foi possível ler as fotos.'); }
  if(!fotos.length) return toast('Não há fotos para exportar. Use Exportar backup.');
  const base = JSON.stringify(Regras.montarBackup(dados, new Date().toISOString()));
  const mb = (base.length + fotos.reduce((a, x) => a + x.bytes * 4 / 3 + 300, 0)) / 1048576;
  mostrarDialogo({ titulo: 'Exportar com fotos?', texto: `O arquivo terá cerca de ${formatarMB(mb * 1048576)}.`, cancelar: 'Cancelar', ok: 'Exportar', acao: () => gerarBackupComFotos(base, fotos) });
}
async function gerarBackupComFotos(base, fotos){
  toast('Preparando o backup…');
  try{
    const partes = [base.slice(0, -1) + ',"fotos":['];
    for(let i = 0; i < fotos.length; i++){
      const x = fotos[i];
      partes.push((i ? ',' : '') + JSON.stringify({ id: x.id, anotacaoId: x.anotacaoId, tipo: x.tipo, largura: x.largura, altura: x.altura, bytes: x.bytes, criadoEm: x.criadoEm, dados: await Fotos.paraBase64(x.blob) }));
    }
    partes.push(']}');
    const nome = 'rotina-backup-com-fotos-' + hoje() + '.json';
    if(NATIVO){
      const FS = plugin('Filesystem');
      const r = await FS.writeFile({ path: nome, data: partes[0], directory: 'CACHE', encoding: 'utf8' });
      for(const p of partes.slice(1)) await FS.appendFile({ path: nome, data: p, directory: 'CACHE', encoding: 'utf8' });
      await plugin('Share').share({ title: 'Backup da rotina com fotos', dialogTitle: 'Salvar ou enviar o backup', files: [r.uri] });
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(partes, { type: 'application/json' })); a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('Backup com fotos salvo em Downloads');
  }catch(e){ if(!/cancel/i.test(String(e && (e.message || e)))) toast('Não foi possível exportar o backup com fotos.'); }
}

function definirRegistro(d, mid, r){

let filaAlertas = [];

function aposMudarFaltas(){
  const f = fac();
  if(!f.semestre) return;
  const est = estFac(), novos = [];
  let mudou = false;
  f.materias.forEach(m => {
    const s = est[m.id];
    if(!s) return;
    const antes = f.alertasEnviados[m.id] || [], r = Faculdade.avaliarAlertas(antes, s.atingidos);
    if(r.enviados.join() !== antes.join()){ mudou = true; if(r.enviados.length) f.alertasEnviados[m.id] = r.enviados; else delete f.alertasEnviados[m.id]; }
    if(!m.arquivada) r.novos.forEach(n => novos.push({ m, n, s }));

  if(!novos.length) return;
  novos.sort((a, b) => Faculdade.NIVEIS.indexOf(b.n) - Faculdade.NIVEIS.indexOf(a.n));
  novos.forEach(notificarAlerta);

function aplicarVisor(){ const img = $('visor-img'); if(img && visor) img.style.transform = `translate(${visor.x}px, ${visor.y}px) scale(${visor.escala})`; }

    const v = visor, img = $('visor-img');

      if(ptrsVisor.size < 2) return;

    g.amostras.push([e.timeStamp, e.clientX, e.clientY]); if(g.amostras.length > 8) g.amostras.shift();

      g.tipo = Math.abs(dx) > Math.abs(dy) ? 'troca' : dy > 0 ? 'fechar' : 'nada';

  });

      if(v.escala < 1.05) animarVisor({ escala: 1, x: 0, y: 0 }); else { limitarPan(); aplicarVisor(); }
      if(ptrsVisor.size === 1){ const [p] = ptrsVisor.values(); gV = { tipo: v.escala > 1 ? 'pan' : 'nada', sx: p.x, sy: p.y, x0: v.x, y0: v.y, amostras: [] }; } else gV = null;

    const dt = ult && pri ? Math.max(1, ult[0] - pri[0]) : 1, vx = ult && pri ? (ult[1] - pri[1]) / dt : 0, vy = ult && pri ? (ult[2] - pri[2]) / dt : 0;

function fecharVisor(deVolta){

function assistIr(delta){
  const a = assist;
  a.erro = '';
  if(delta > 0 && a.passo === 1){
    a.semestre.nome = a.semestre.nome.trim();
    a.erro = Faculdade.validarSemestre(a.semestre);
    if(a.erro) return desenharAssistente();
    a.semestre.diasSemAula = a.semestre.diasSemAula.filter(d => d.data >= a.semestre.inicio && d.data <= a.semestre.fim);
  }
  if(delta > 0 && a.passo === 2){
    if(a.form.nome.trim()){ salvarMatAssist(); if(a.erro) return; }
    if(!a.materias.some(m => !m.arquivada)){ a.erro = 'Adicione pelo menos uma matéria.'; return desenharAssistente(); }
  }
  if(delta > 0 && a.passo === 4){
    const l = Number(a.limite);
    if(!Number.isInteger(l) || l < 1 || l > 50){ a.erro = 'Use um limite entre 1% e 50%.'; return desenharAssistente(); }
    return concluirAssistente();
  }
  a.passo += delta; a.grade.sel = null;
  desenharAssistente();
  const sh = $('sheet'); sh.scrollTop = 0;
  const h = $('assist-tit'); if(h){ h.tabIndex = -1; h.focus({ preventScroll: true }); }
}
function concluirAssistente(){
  const a = assist, f = fac(), novo = !a.edicao;
  if(novo){
    f.temposPorDia = a.tempos;
    f.grades = [{ validaDesde: a.semestre.inicio, dias: a.grade.dias }];
    f.alertasEnviados = {};
  } else {
    const ids = new Set(a.materias.map(m => m.id));
    const removidas = f.materias.filter(m => !ids.has(m.id)).map(m => m.id);
    if(removidas.length) f.grades.forEach(g => Object.values(g.dias).forEach(s => s.forEach((x, i) => { if(removidas.includes(x)) s[i] = null; })));
    if(JSON.stringify(a.tempos) !== JSON.stringify(f.temposPorDia)){
      const ini = diaGradeNova(), vig = Faculdade.gradeVigente(f, ini);
      f.temposPorDia = a.tempos;
      f.grades = Faculdade.aplicarGrade(f.grades, Faculdade.ajustarTempos(vig ? vig.dias : {}, a.tempos).dias, ini);
    }
  }
  f.semestre = { ...a.semestre };
  f.materias = a.materias;
  f.horario = { ...f.horario, inicio: a.horario.inicio || null, duracaoMin: a.horario.duracaoMin || null };
  f.limiteFaltas = Number(a.limite);
  f.alertasAtivos = a.alertas;

  assist = null; gradeRasc = null;
  fecharSheet();
  aposMudarFaltas();
  if(novo){ facAba = 'hoje'; facDia = hoje(); }
  render(true);
  toast(novo ? 'Semestre configurado' : 'Semestre atualizado');
  if(fac().alertasAtivos && !a.alertas0){ pedirPermissaoFac(); mostrarProximoAlerta(); }
}

  if(!NATIVO) return;
  const LN = plugin('LocalNotifications');
  LN.createChannel({ id: 'lembretes', name: 'Lembretes', description: 'Avisos das tarefas com horário', importance: 4, visibility: 1 }).catch(() => {});
  LN.createChannel({ id: 'alertas', name: 'Alertas de faltas', description: 'Avisos quando as faltas chegam perto do limite', importance: 4, visibility: 1 }).catch(() => {});
  LN.addListener('localNotificationActionPerformed', ev => {
    const extra = ev && ev.notification && ev.notification.extra;
    if(extra && extra.tipo === 'falta'){ verMateria(extra.ref); return; }
    if(document.getElementById('overlay').classList.contains('show')) return;
    diaSel = hoje();
    if(tela !== 'rotina') irPara('rotina'); else render();
  });
  document.addEventListener('visibilitychange', () => { if(!document.hidden){ agendarReconciliacao(); if(tela === 'ajustes') atualizarEstadoNotif(); } });
  agendarReconciliacao();
}

// faz funcionar offline e permite instalar como app (no APK os arquivos já estão no aparelho)
if(!NATIVO && 'serviceWorker' in navigator){
  try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
}

const BV_TELAS = [
  ['Sua rotina em seções', 'Agrupe o que você faz todo dia: treino, estudo, casa.',
    '<svg viewBox="0 0 160 160" aria-hidden="true"><circle class="il-fundo" cx="80" cy="80" r="72"/><rect class="il-bloco" x="34" y="40" width="92" height="22" rx="8"/><rect class="il-bloco" x="34" y="69" width="92" height="22" rx="8"/><rect class="il-bloco" x="34" y="98" width="92" height="22" rx="8"/><circle class="il-a" cx="48" cy="51" r="6"/><circle class="il-b" cx="48" cy="80" r="6"/><circle class="il-c" cx="48" cy="109" r="6"/><path class="il-traco" d="M62 51h46M62 80h34M62 109h40"/></svg>'],
  ['Marque com um toque', 'Toque para marcar. Deslize para a direita para marcar e para a esquerda para excluir.',
    '<svg viewBox="0 0 160 160" aria-hidden="true"><circle class="il-fundo" cx="80" cy="80" r="72"/><rect class="il-bloco" x="26" y="58" width="108" height="44" rx="12"/><rect x="38" y="70" width="20" height="20" rx="6" fill="var(--primary)"/><path d="M42 80l4 4 8-8" fill="none" stroke="var(--on-primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path class="il-traco" d="M68 80h50"/><path class="il-traco" d="M60 122h40M90 114l10 8-10 8"/></svg>'],
  ['Acompanhe sua constância', 'Veja sua sequência e sua semana na aba Progresso.',
    '<svg viewBox="0 0 160 160" aria-hidden="true"><circle class="il-fundo" cx="80" cy="80" r="72"/><rect class="il-bloco" x="38" y="88" width="16" height="30" rx="5"/><rect class="il-bloco" x="62" y="70" width="16" height="48" rx="5"/><rect class="il-bloco" x="86" y="56" width="16" height="62" rx="5"/><path class="il-chama" d="M118 34c2 6 8 10 8 18a9 9 0 0 1-18 0c0-4 2-7 4-9 0 3 2 5 4 6-1-5 0-10 2-15z"/></svg>'],
];
let bvTela = 0;
const deveMostrarBoasVindas = () => !dados.ajustes.boasVindasVista && !dados.secoes.length && !dados.tarefas.length && !Object.keys(dados.feitos).length;
function mostrarBoasVindas(){
  const el = document.createElement('div');
  el.className = 'bv'; el.id = 'boas-vindas';
  el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'Boas-vindas');
  el.innerHTML = `<div class="bv-trilho" id="bv-trilho">${BV_TELAS.map(([t, p, il], i) => `<section class="bv-tela" aria-hidden="${i !== 0}">${il}<h2>${t}</h2><p>${p}</p></section>`).join('')}</div>
    <div class="bv-pontos" aria-hidden="true">${BV_TELAS.map((_, i) => `<i class="${i === 0 ? 'on' : ''}"></i>`).join('')}</div>
    <p class="sr" aria-live="polite" id="bv-status">Tela 1 de 3</p>
    <div class="bv-acoes"><button class="btn text" onclick="fecharBoasVindas()">Pular</button><button class="btn" id="bv-proximo" onclick="bvAvancar()">Próximo</button></div>`;
  document.body.appendChild(el);
  ['app', 'toast'].forEach(id => $(id).setAttribute('inert', ''));
  document.querySelector('nav.tabs').setAttribute('inert', '');
  bvTela = 0;
  if(!Animacoes.reduzido()) el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: Animacoes.MOV.base, easing: Animacoes.MOV.saida });
  setTimeout(() => $('bv-proximo').focus(), 50);
}
function bvIr(i){
  bvTela = Math.max(0, Math.min(BV_TELAS.length - 1, i));
  const tr = $('bv-trilho'); if(!tr) return;
  tr.style.transform = `translateX(${-bvTela * 100}%)`;
  tr.querySelectorAll('.bv-tela').forEach((s, k) => s.setAttribute('aria-hidden', k !== bvTela));
  document.querySelectorAll('.bv-pontos i').forEach((p, k) => p.classList.toggle('on', k === bvTela));
  $('bv-status').textContent = `Tela ${bvTela + 1} de ${BV_TELAS.length}: ${BV_TELAS[bvTela][0]}`;
  $('bv-proximo').textContent = bvTela === BV_TELAS.length - 1 ? 'Começar' : 'Próximo';
}
function bvAvancar(){ if(bvTela === BV_TELAS.length - 1) fecharBoasVindas(); else bvIr(bvTela + 1); }
function fecharBoasVindas(){
  const el = $('boas-vindas'); if(!el) return;
  dados.ajustes.boasVindasVista = true; salvar();
  ['app', 'toast'].forEach(id => $(id).removeAttribute('inert'));
  document.querySelector('nav.tabs').removeAttribute('inert');
  const fim = () => { el.remove(); escolherInicio(); };
  if(Animacoes.reduzido()) return fim();
  el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: Animacoes.MOV.rapida, easing: Animacoes.MOV.entrada, fill: 'forwards' }).onfinish = fim;
}
function escolherInicio(){
  abrirSheet(`<h2>Escolha por onde começar</h2>
    <p class="hint">Comece com um modelo de seção. Dá para mudar tudo depois.</p>
    <div class="chips">${MODELOS.map((m, i) => `<button class="chip" onclick="usarModelo(${i})"><span>${m.emoji} ${m.nome || 'Personalizada'}</span></button>`).join('')}</div>
    ${NATIVO ? '<button class="btn ghost" onclick="fecharSheet();setTimeout(importarBackup, 60)">Importar backup do navegador</button>' : ''}
    <button class="btn text" onclick="fecharSheet()">Começar do zero</button>`);
}
let bvArraste = null;
document.addEventListener('pointerdown', e => {
  const tr = e.target.closest('#bv-trilho');
  if(!tr || e.button > 0) return;
  bvArraste = { tr, x: e.clientX, y: e.clientY, dx: 0, ativo: false, id: e.pointerId, t: e.timeStamp };
});
document.addEventListener('pointermove', e => {
  const a = bvArraste;
  if(!a || e.pointerId !== a.id) return;
  const dx = e.clientX - a.x, dy = e.clientY - a.y;
  if(!a.ativo){
    if(Math.abs(dx) < Animacoes.GESTO.trava && Math.abs(dy) < Animacoes.GESTO.trava) return;
    if(Math.abs(dy) > Math.abs(dx)){ bvArraste = null; return; }
    a.ativo = true; a.tr.classList.add('arrastando');
    try{ a.tr.setPointerCapture(e.pointerId); }catch(err){}
  }
  const naBorda = (bvTela === 0 && dx > 0) || (bvTela === BV_TELAS.length - 1 && dx < 0);
  a.dx = naBorda ? dx * Animacoes.GESTO.resistencia : dx;
  a.tr.style.transform = `translateX(calc(${-bvTela * 100}% + ${a.dx}px))`;
});
document.addEventListener('pointerup', e => {
  const a = bvArraste;
  if(!a || e.pointerId !== a.id) return;
  bvArraste = null;
  a.tr.classList.remove('arrastando');
  if(!a.ativo) return;
  const decisao = Animacoes.decidirGesto({ dx: a.dx, dy: 0, largura: a.tr.offsetWidth, velocidade: a.dx / Math.max(1, e.timeStamp - a.t) });
  bvIr(decisao === 'excluir' ? bvTela + 1 : decisao === 'marcar' ? bvTela - 1 : bvTela);
});
function telaErro(){
  document.querySelector('nav.tabs').innerHTML = '';
  document.getElementById('app').innerHTML = `
    <div class="empty" role="alert">
      <p>Não foi possível carregar suas tarefas.</p>
      <button class="btn" onclick="iniciar()">Tentar novamente</button>
    </div>`;
}
function iniciar(){
  try{ dados = carregar(); }
  catch(e){ dados = null; console.error('Falha ao carregar os dados:', e && e.message); telaErro(); return; }
  if(history.state) history.replaceState(null, '');
  if(NATIVO) document.getElementById('arquivo').removeAttribute('accept');
  aplicarTema(); montarNav(); render();
  iniciarLembretes();
  if(deveMostrarBoasVindas()) mostrarBoasVindas();
  diaFestaVisto = hojeFesta();
  agendarVirada();
  setTimeout(limparFotosOrfas, 3000);
  const pedida = new URLSearchParams(location.search).get('materia');
  if(pedida){ history.replaceState(null, '', location.pathname); if(materiaDe(pedida)) setTimeout(() => verMateria(pedida), 100); }
}
iniciar();
</script>
