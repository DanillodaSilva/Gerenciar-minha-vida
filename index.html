    display:inline-flex;align-items:center;gap:var(--space-2);min-height:var(--fab-h);padding:0 var(--space-5) 0 var(--space-4);border-radius:var(--radius-fab);

  .fab:active{box-shadow:none}

  .esqueleto b,.esqueleto i{display:block;background:var(--surface-variant);border-radius:var(--radius-card)}

  .item .info.sem-check{padding-left:var(--space-4)}

  .overlay{position:fixed;inset:0;background:var(--scrim);display:none;align-items:flex-end;justify-content:center;z-index:10}

  .sheet{background:var(--surface);width:100%;max-width:var(--content-max);border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;box-shadow:var(--shadow-sheet);
    padding:var(--space-5) var(--space-4) calc(var(--space-5) + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:var(--space-3);
    max-height:90vh;overflow:auto;overscroll-behavior:contain}
  .sheet h2{margin:0;font-size:var(--fs-title);line-height:var(--lh-title);font-weight:var(--w-semibold)}
  .sheet label{font-size:var(--fs-label);line-height:var(--lh-label);font-weight:var(--w-medium);color:var(--text-secondary);display:flex;flex-direction:column;gap:var(--space-2)}
  .chips{display:flex;flex-wrap:wrap;gap:0 var(--space-2)}
  .chip{min-height:var(--touch);display:inline-flex;align-items:center;background:none;padding:0}
  .chip>span{display:inline-flex;align-items:center;gap:var(--space-1);min-height:var(--chip-h);padding:0 var(--space-3);border-radius:var(--radius-chip);
    background:var(--chip-bg);border:var(--border-width) solid var(--chip-border);font-size:var(--fs-label);line-height:var(--lh-label);font-weight:var(--w-medium);color:var(--text-primary)}
  .chip.on>span{background:var(--primary-container);border-color:var(--primary);color:var(--on-container)}
  .colors{display:flex;gap:0;flex-wrap:wrap}
  .colors button{width:var(--touch);height:var(--touch);display:grid;place-items:center}
  .colors button i{width:var(--space-6);height:var(--space-6);border-radius:var(--radius-full);background:var(--c);display:grid;place-items:center;color:var(--surface)}
  .colors button.on i{box-shadow:0 0 0 var(--border-focus) var(--surface),0 0 0 calc(var(--border-focus) * 2) var(--text-primary)}

  .toast{position:fixed;left:var(--space-4);right:var(--space-4);bottom:calc(var(--nav-h) + var(--fab-h) + var(--space-5) + env(safe-area-inset-bottom));max-width:var(--content-max);margin:0 auto;
    background:var(--snack-bg);color:var(--snack-fg);min-height:var(--touch);padding:var(--space-3) var(--space-4);border-radius:var(--radius-card);
    font-size:var(--fs-label);line-height:var(--lh-label);opacity:0;transform:translateY(var(--space-2));
    transition:opacity var(--dur-move) var(--ease-out),transform var(--dur-move) var(--ease-out);pointer-events:none;z-index:20}
  .toast.show{opacity:1;transform:none}
</style>

<body>
<div class="wrap" id="app"><div class="esqueleto" aria-hidden="true"><b></b><i></i><i></i><i></i></div></div>

<nav class="tabs" aria-label="Navegação principal"></nav>

<div class="overlay" id="overlay" onclick="if(event.target===this)fecharSheet()">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="arquivo" accept="application/json" hidden>

<script src="regras.js"></script>
<script>
/* =========================================================
   DADOS — tudo fica salvo no próprio celular (localStorage)
   estrutura (schemaVersion 2, migração em regras.js):
   { schemaVersion, ajustes: { tema }, tarefas: [],
     secoes: [{ id, nome, emoji, cor, corToken, rotuloNome, rotuloDetalhe,
                itens: [{ id, nome, detalhe, criadoEm, notas, horario, dias }] }],
     feitos: { "AAAA-MM-DD": [idItem, ...] } }
   ========================================================= */
const CHAVE = 'rotina-app-v1';
const { CORES, corTokenDe } = Regras;
const NOME_COR = { green:'Verde', blue:'Azul', teal:'Verde-azulado', orange:'Laranja', red:'Vermelho', yellow:'Amarelo', brown:'Marrom', gray:'Cinza' };
const corDe = s => `var(--cat-${corTokenDe(s)})`;
const tintaDe = s => `--c:var(--cat-${corTokenDe(s)});--cc:var(--cat-${corTokenDe(s)}-container)`;
const MODELOS = [
  { nome:'Treino', emoji:'🏋️', corToken:'red',   rotuloNome:'Exercício', rotuloDetalhe:'Carga' },
  { nome:'Estudo', emoji:'📚', corToken:'teal',  rotuloNome:'Matéria',   rotuloDetalhe:'Duração' },
  { nome:'',       emoji:'⭐', corToken:'green', rotuloNome:'Tarefa',    rotuloDetalhe:'Detalhe' },
];
const ICONES = {
  check:'M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z',
  add:'M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z',
  voltar:'M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z',
  anterior:'M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z',
  proximo:'M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z',
  mais:'M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z',
  editar:'M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z',
  excluir:'M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z',
  hoje:'M22 5.18L10.59 16.6l-4.24-4.24 1.41-1.41 2.83 2.83 10-10L22 5.18zm-2.21 5.04c.13.57.21 1.17.21 1.78 0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8c1.58 0 3.04.46 4.28 1.25l1.44-1.44C16.1 2.67 14.13 2 12 2 6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10c0-1.19-.22-2.33-.6-3.39l-1.61 1.61z',
  calendario:'M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z',
  grafico:'M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z',
  ajustes:'M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z',
  expandir:'M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z',
  repetir:'M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z',
  fogo:'M13.5.67s.74 2.65.74 4.8c0 2.06-1.35 3.73-3.41 3.73-2.07 0-3.63-1.67-3.63-3.73l.03-.36C5.21 7.51 4 10.62 4 14c0 4.42 3.58 8 8 8s8-3.58 8-8C20 8.61 17.41 3.8 13.5.67zM11.71 19c-1.78 0-3.22-1.4-3.22-3.14 0-1.62 1.05-2.76 2.81-3.12 1.77-.36 3.6-1.21 4.62-2.58.39 1.29.59 2.65.59 4.04 0 2.65-2.15 4.8-4.8 4.8z',
};
const ic = (nome, extra = '') => `<svg class="ic ${extra}" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="${ICONES[nome]}"/></svg>`;
const ABAS = [['rotina','hoje','Hoje'], ['constancia','grafico','Constância'], ['ajustes','ajustes','Ajustes']];
function montarNav(){
  document.querySelector('nav.tabs').innerHTML = ABAS.map(([id, icone, rotulo]) =>
    `<button id="tab-${id}" onclick="irPara('${id}')"><span class="ind">${ic(icone)}</span>${rotulo}</button>`).join('');
}

/* ---------- datas e constância: regras.js ---------- */
const { fmt, somaDias, curto } = Regras;
const hoje = () => fmt(new Date());
const nomeDia = iso => Regras.nomeDia(iso, hoje());
const itensDoDia = (dia, secao) => Regras.itensDoDia(dados, dia, secao);
const feito = (dia, idItem) => Regras.feito(dados, dia, idItem);
const resumoDia = (dia, secao) => Regras.resumoDia(dados, dia, secao);

let dados = null;
let tela = 'rotina';        // rotina | secao | constancia | ajustes
let secaoAberta = null;     // id da seção aberta
let diaSel = hoje();        // dia que está sendo marcado
let periodo = 7;            // período do gráfico

function carregar(){
  const bruto = localStorage.getItem(CHAVE);
  const { dados: d, migrou, deVersao } = Regras.migrar(bruto);
  if(migrou){
    const chaveBackup = 'backup_pre_v' + Regras.SCHEMA;
    if(deVersao < Regras.SCHEMA && localStorage.getItem(chaveBackup) === null) localStorage.setItem(chaveBackup, bruto);
    localStorage.setItem(CHAVE, JSON.stringify(d));
  }
  return d;
}
function salvar(){
  if(!dados) return;
  try{ localStorage.setItem(CHAVE, JSON.stringify(dados)); }
  catch(e){ toast('Não consegui salvar 😕'); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function alternar(idItem){
  const lista = dados.feitos[diaSel] || [];
  dados.feitos[diaSel] = lista.includes(idItem) ? lista.filter(x => x !== idItem) : [...lista, idItem];
  if(!dados.feitos[diaSel].length) delete dados.feitos[diaSel];
  salvar(); render();
}

/* ---------- navegação (botão voltar do Android funciona) ---------- */
function irPara(t){
  if(tela === 'secao') history.back();
  tela = t; secaoAberta = null; render(); scrollTo(0,0);
}
function abrirSecao(id){
  secaoAberta = id; tela = 'secao';
  history.pushState({secao:id}, '');
  render(); scrollTo(0,0);
}
let ignorarPop = false; // true quando nós mesmos chamamos history.back() pra fechar uma janela
addEventListener('popstate', () => {
  if(ignorarPop){ ignorarPop = false; return; }
  if(document.getElementById('overlay').classList.contains('show')){ fecharSheet(true); return; }
  if(tela === 'secao'){ tela = 'rotina'; secaoAberta = null; render(); }
});

/* ---------- telas ---------- */
function render(){
  if(!dados) return;
  ABAS.forEach(([t]) => {
    const on = t === tela || (t==='rotina' && tela==='secao');
    const b = document.getElementById('tab-'+t);
    b.classList.toggle('on', on);
    if(on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  const app = document.getElementById('app');
  app.classList.toggle('com-fab', tela === 'rotina');
  if(tela === 'rotina')     app.innerHTML = telaHoje();
  if(tela === 'secao')      app.innerHTML = telaSecao();
  if(tela === 'constancia') app.innerHTML = telaConstancia();
  if(tela === 'ajustes')    app.innerHTML = telaAjustes();
}

function seletorDia(){
  return `<div class="day">
    <button class="icon-btn" onclick="mudarDia(-1)" aria-label="Dia anterior">${ic('anterior')}</button>
    <span>${nomeDia(diaSel)}</span>
    <button class="icon-btn" onclick="mudarDia(1)" ${diaSel >= hoje() ? 'disabled' : ''} aria-label="Próximo dia">${ic('proximo')}</button>
  </div>`;
}
function mudarDia(n){ const d = somaDias(diaSel, n); if(d <= hoje()){ diaSel = d; render(); } }

let concluidasAbertas = false;
const dois = n => String(n).padStart(2, '0');
const horaAgora = () => { const d = new Date(); return dois(d.getHours()) + ':' + dois(d.getMinutes()); };
function anel(feitas, total){
  if(!total) return '';
  const pct = Math.round(feitas / total * 100);
  return `<div class="anel" role="img" aria-label="${feitas} de ${total} concluídas">
    <svg viewBox="0 0 48 48" aria-hidden="true"><circle class="trilho" cx="24" cy="24" r="21.5"/><circle class="arco ${pct ? '' : 'zero'}" cx="24" cy="24" r="21.5" pathLength="100" stroke-dasharray="${pct} 100"/></svg>
    <span aria-hidden="true">${feitas} de ${total}</span></div>`;
}
function linhaHoje(s, i, comSecao){
  const partes = [];
  if(i.horario){
    const passou = diaSel === hoje() && !feito(diaSel, i.id) && i.horario < horaAgora();
    partes.push(passou ? `<span class="passou">${esc(i.horario)}, já passou</span>` : esc(i.horario));
  }
  if(comSecao) partes.push(`<span class="cat"><i class="ponto"></i>${esc(s.nome)}</span>`);
  if(i.detalhe) partes.push(esc(s.rotuloDetalhe) + ': ' + esc(i.detalhe));
  if(i.dias.length < 7) partes.push(`<span class="rep">${ic('repetir','sm')}${Regras.resumoDias(i.dias)}</span>`);
  return partes.length ? `<small>${partes.join(' · ')}</small>` : '';
}
function itemHoje(s, i, comSecao){
  const f = feito(diaSel, i.id);
  return `<div class="item ${f ? 'done' : ''}" style="--c:${corDe(s)}">
    <button class="check" role="checkbox" aria-checked="${f}" aria-label="${esc(i.nome)}" onclick="alternar('${i.id}')"><i>${ic('check')}</i></button>
    <div class="info" role="button" tabindex="0" onclick="sheetItem('${i.id}','${s.id}')" onkeydown="if(event.key==='Enter')this.click()">
      <b>${esc(i.nome)}</b>${linhaHoje(s, i, comSecao)}
    </div>
  </div>`;
}
function telaHoje(){
  const r = resumoDia(diaSel);
  const ehHoje = diaSel === hoje();
  const grupos = [], concluidas = [];
  dados.secoes.forEach(s => {
    const itens = Regras.ordenarItens(itensDoDia(diaSel, s));
    const pendentes = itens.filter(i => !feito(diaSel, i.id));
    itens.filter(i => feito(diaSel, i.id)).forEach(i => concluidas.push([s, i]));
    if(!pendentes.length) return;
    const rs = resumoDia(diaSel, s);
    grupos.push(`<section class="grupo tinta" style="${tintaDe(s)}">
      <button class="grupo-top" onclick="abrirSecao('${s.id}')" aria-label="Abrir ${esc(s.nome)}, ${rs.feitas} de ${rs.total} feitas">
        <span class="emo" aria-hidden="true">${esc(s.emoji)}</span><span class="nm">${esc(s.nome)}</span><span class="cont">${rs.feitas} de ${rs.total}</span>${ic('proximo','sm')}
      </button>
      <div class="lista">${pendentes.map(i => itemHoje(s, i, false)).join('')}</div>
    </section>`);
  });
  let corpo;
  if(!r.total){
    corpo = `<div class="vazio">${ic('calendario','lg')}<p>${ehHoje ? 'Nenhuma tarefa para hoje.' : 'Nenhuma tarefa neste dia.'}</p>
      <button class="btn" onclick="novaTarefa()">Adicionar tarefa</button></div>`;
  } else {
    const tudo = r.feitas === r.total ? `<div class="vazio tudo-feito" role="status">${ic('hoje','lg')}<p><b>${ehHoje ? 'Tudo feito por hoje' : 'Tudo feito neste dia'}</b><br><small>${r.feitas} de ${r.total} concluídas</small></p></div>` : '';
    const listaConcl = concluidas.length ? `<section class="grupo">
      <button class="grupo-top" aria-expanded="${concluidasAbertas}" onclick="concluidasAbertas=!concluidasAbertas;render()">
        <span class="nm">Concluídas (${concluidas.length})</span>${ic('expandir','sm')}
      </button>
      ${concluidasAbertas ? `<div class="lista">${concluidas.map(([s, i]) => itemHoje(s, i, true)).join('')}</div>` : ''}
    </section>` : '';
    corpo = tudo + grupos.join('') + listaConcl;
  }
  return `
    <header class="hoje-top">
      <div class="hoje-tit">
        <h1>${ehHoje ? 'Hoje' : Regras.rotuloDia(diaSel, hoje())}</h1>
        <div class="hoje-data">
          <span>${Regras.dataExtenso(diaSel)}</span>
          <span class="setas">
            <button class="icon-btn" onclick="mudarDia(-1)" aria-label="Dia anterior">${ic('anterior')}</button>
            <button class="icon-btn" onclick="mudarDia(1)" ${ehHoje ? 'disabled' : ''} aria-label="Próximo dia">${ic('proximo')}</button>
          </span>
        </div>
      </div>
      ${anel(r.feitas, r.total)}
    </header>
    ${corpo}
    <button class="btn text nova-secao" onclick="sheetSecao()">${ic('add')} Nova seção</button>
    <button class="fab" onclick="novaTarefa()">${ic('add')}<span>Nova tarefa</span></button>
  `;
}
function novaTarefa(){
  if(!dados.secoes.length){ sheetSecao(); return; }
  sheetItem(null, dados.secoes[0].id, true);
}

function linhaItem(s, i){
  const partes = [];
  if(i.horario) partes.push(esc(i.horario));
  if(i.detalhe) partes.push(esc(s.rotuloDetalhe) + ': ' + esc(i.detalhe));
  if(Array.isArray(i.dias) && i.dias.length && i.dias.length < 7) partes.push(Regras.resumoDias(i.dias));
  return partes.length ? `<small>${partes.join(' · ')}</small>` : '';
}
function telaSecao(){
  const s = dados.secoes.find(x => x.id === secaoAberta);
  if(!s){ tela = 'rotina'; return telaHoje(); }
  const r = resumoDia(diaSel, s);
  const itens = s.itens.filter(i => i.criadoEm <= diaSel && Regras.repeteNoDia(i, diaSel));
  const outros = s.itens.filter(i => !itens.includes(i));
  const lista = itens.map(i => {
    const f = feito(diaSel, i.id);
    return `
    <div class="item tinta ${f ? 'done' : ''}" style="${tintaDe(s)}">
      <button class="check" role="checkbox" aria-checked="${f}" onclick="alternar('${i.id}')" aria-label="${esc(i.nome)}"><i>${ic('check')}</i></button>
      <div class="info" onclick="alternar('${i.id}')">
        <b>${esc(i.nome)}</b>
        ${linhaItem(s, i)}
      </div>
      <button class="more" onclick="sheetItem('${i.id}')" aria-label="Editar ${esc(i.nome)}">${ic('mais')}</button>
    </div>`; }).join('');
  const listaOutros = outros.map(i => `
    <div class="item tinta" style="${tintaDe(s)}">
      <div class="info sem-check" onclick="sheetItem('${i.id}')"><b>${esc(i.nome)}</b>${linhaItem(s, i)}</div>
      <button class="more" onclick="sheetItem('${i.id}')" aria-label="Editar ${esc(i.nome)}">${ic('mais')}</button>
    </div>`).join('');
  return `
    <header class="top">
      <button class="icon-btn" onclick="history.back()" aria-label="Voltar">${ic('voltar')}</button>
      <h1>${esc(s.emoji)} ${esc(s.nome)}</h1>
      <button class="icon-btn" onclick="sheetSecao('${s.id}')" aria-label="Editar seção">${ic('editar')}</button>
    </header>
    ${seletorDia()}
    <div class="summary tinta" style="${tintaDe(s)}">
      <div class="big">${r.pct}%</div>
      <small>${r.feitas} de ${r.total} feitas · ${nomeDia(diaSel).toLowerCase()}</small>
      <div class="bar"><i style="width:${r.pct}%"></i></div>
    </div>
    ${lista || `<p class="empty">${s.itens.length ? 'Nada desta seção para ' + nomeDia(diaSel).toLowerCase() + '.' : 'Nenhum item. Adicione o primeiro ' + esc(s.rotuloNome.toLowerCase()) + '.'}</p>`}
    ${listaOutros ? `<h3 class="secao-titulo">Outros dias</h3>${listaOutros}` : ''}
    <button class="btn" onclick="sheetItem()">${ic('add')} Adicionar ${esc(s.rotuloNome.toLowerCase())}</button>
  `;
}

function telaConstancia(){
  if(!dados.secoes.some(s => s.itens.length))
    return `<header class="top"><h1>Constância</h1></header>
            <p class="empty">Adicione itens na sua rotina e vá marcando o que fizer. O gráfico aparece aqui.</p>`;

  const dias = [];
  for(let i = periodo - 1; i >= 0; i--) dias.push(somaDias(hoje(), -i));
  const resumos = dias.map(d => ({ d, ...resumoDia(d) }));
  const comTarefa = resumos.filter(r => r.total);
  const tot = comTarefa.reduce((a,r) => a + r.total, 0);
  const fei = comTarefa.reduce((a,r) => a + r.feitas, 0);
  const media = tot ? Math.round(fei / tot * 100) : 0;

  const seq = Regras.sequencia(dados, hoje());
  const melhor = comTarefa.length ? Math.max(...comTarefa.map(r => r.pct)) : 0;

  const passo = periodo > 14 ? 5 : 1;
  const barras = resumos.map((r, idx) => `
    <div class="col">
      <div class="b ${r.pct ? '' : 'zero'}" style="height:${Math.max(r.pct, 2)}%">
        ${periodo <= 14 && r.total ? `<span>${r.pct}%</span>` : ''}
      </div>
      <div class="lbl">${(idx % passo === 0 || idx === resumos.length - 1) ? curto(r.d) : '&nbsp;'}</div>
    </div>`).join('');

  const porSecao = dados.secoes.map(s => {
    let t = 0, f = 0;
    dias.forEach(d => { const r = resumoDia(d, s); t += r.total; f += r.feitas; });
    const p = t ? Math.round(f / t * 100) : 0;
    return `<div class="secstat" style="--c:${corDe(s)}">
      <div class="top"><span>${esc(s.emoji)} ${esc(s.nome)}</span><b>${p}%</b></div>
      <div class="bar"><i style="width:${p}%"></i></div>
    </div>`;
  }).join('');

  return `
    <header class="top"><h1>Constância</h1></header>
    <div class="seg">
      ${[7,30,90].map(p => `<button class="${p===periodo?'on':''}" onclick="periodo=${p};render()">${p} dias</button>`).join('')}
    </div>
    <div class="summary">
      <small>Nos últimos ${periodo} dias você cumpriu</small>
      <div class="big">${media}%</div>
      <small>${fei} de ${tot} tarefas</small>
      <div class="bar"><i style="width:${media}%"></i></div>
    </div>
    <div class="stats">
      <div class="stat"><b>${resumoDia(hoje()).pct}%</b><small>hoje</small></div>
      <div class="stat"><b>${seq}</b><small>dias seguidos ≥50%</small></div>
      <div class="stat"><b>${melhor}%</b><small>melhor dia</small></div>
    </div>
    <div class="card">
      <h3>Dia a dia</h3>
      <div class="chart">${barras}</div>
    </div>
    <div class="card">
      <h3>Por seção</h3>
      ${porSecao}
    </div>
  `;
}

function telaAjustes(){
  return `
    <header class="top"><h1>Ajustes</h1></header>
    <div class="card">
      <h3>Backup</h3>
      <p class="hint">Seus dados ficam só neste celular. Se limpar os dados do navegador ou trocar de celular, eles somem. Faça um backup de vez em quando.</p>
      <div class="row mt">
        <button class="btn" onclick="exportar()">Salvar backup</button>
        <button class="btn ghost" onclick="document.getElementById('arquivo').click()">Restaurar</button>
      </div>
    </div>
    <div class="card">
      <h3>Zerar tudo</h3>
      <p class="hint">Apaga todas as seções, itens e histórico.</p>
      <button class="btn danger mt" onclick="sheetConfirmar('Apagar tudo?','Isso não dá pra desfazer.',()=>{dados={...Regras.vazio(),ajustes:dados.ajustes};salvar();render();toast('Tudo apagado')})">Apagar tudo</button>
    </div>
  `;
}

/* ---------- janelas (bottom sheets) ---------- */
function abrirSheet(html){
  document.getElementById('sheet').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
  history.pushState({sheet:true}, '');
  const primeiro = document.querySelector('#sheet input');
  if(primeiro && !primeiro.value) setTimeout(() => primeiro.focus(), 80);
}
function fecharSheet(vindoDoVoltar){
  document.getElementById('overlay').classList.remove('show');
  if(!vindoDoVoltar){ ignorarPop = true; history.back(); }
}

let rascunho = null;
function sheetSecao(id){
  const s = id ? dados.secoes.find(x => x.id === id) : null;
  rascunho = s ? {...s} : {...MODELOS[0], modelo:0};
  desenharSheetSecao(!!s);
}
function desenharSheetSecao(editando){
  const r = rascunho;
  abrirSheetOuAtualizar(`
    <h2>${editando ? 'Editar seção' : 'Nova seção'}</h2>
    ${editando ? '' : `<div class="chips">
      ${MODELOS.map((m,i) => `<button class="chip ${r.modelo===i?'on':''}" aria-pressed="${r.modelo===i}" onclick="usarModelo(${i})"><span>${m.emoji} ${m.nome || 'Personalizada'}</span></button>`).join('')}
    </div>`}
    <div class="row">
      <label class="emoji-field">Emoji<input id="f-emoji" value="${esc(r.emoji)}" maxlength="4"></label>
      <label>Nome da seção<input id="f-nome" value="${esc(r.nome)}" placeholder="Ex.: Treino"></label>
    </div>
    <div class="row">
      <label>Cada item é um(a)…<input id="f-rn" value="${esc(r.rotuloNome)}" placeholder="Ex.: Exercício"></label>
      <label>E tem…<input id="f-rd" value="${esc(r.rotuloDetalhe)}" placeholder="Ex.: Carga"></label>
    </div>
    <label>Cor<div class="colors" role="radiogroup" aria-label="Cor da seção">
      ${CORES.map(c => { const on = corTokenDe(r) === c; return `<button role="radio" aria-checked="${on}" aria-label="${NOME_COR[c]}" style="--c:var(--cat-${c})" class="${on?'on':''}" onclick="lerSecao();rascunho.corToken='${c}';desenharSheetSecao(${editando})"><i>${on ? ic('check','sm') : ''}</i></button>`; }).join('')}
    </div></label>
    <button class="btn" onclick="salvarSecao(${editando})">${editando ? 'Salvar' : 'Criar seção'}</button>
    ${editando ? `<button class="btn danger" onclick="excluirSecao()">Excluir seção</button>` : ''}
  `);
}
function abrirSheetOuAtualizar(html){
  if(document.getElementById('overlay').classList.contains('show')) document.getElementById('sheet').innerHTML = html;
  else abrirSheet(html);
}
function lerSecao(){
  rascunho.emoji = document.getElementById('f-emoji').value.trim() || '⭐';
  rascunho.nome = document.getElementById('f-nome').value.trim();
  rascunho.rotuloNome = document.getElementById('f-rn').value.trim() || 'Tarefa';
  rascunho.rotuloDetalhe = document.getElementById('f-rd').value.trim() || 'Detalhe';
}
function usarModelo(i){ rascunho = {...MODELOS[i], modelo:i}; desenharSheetSecao(false); }
function salvarSecao(editando){
  lerSecao();
  if(!rascunho.nome){ toast('Dá um nome pra seção'); return; }
  const { modelo, ...s } = rascunho;
  if(editando){
    const i = dados.secoes.findIndex(x => x.id === s.id);
    dados.secoes[i] = { ...dados.secoes[i], ...s };
  } else {
    dados.secoes.push({ ...s, id: uid(), itens: [] });
  }
  salvar(); fecharSheet(); render(); toast(editando ? 'Seção salva' : 'Seção criada');
}
function excluirSecao(){
  const s = rascunho;
  sheetConfirmar(`Excluir "${s.nome}"?`, 'Os itens e o histórico dessa seção somem da constância.', () => {
    dados.secoes = dados.secoes.filter(x => x.id !== s.id);
    salvar(); tela = 'rotina'; secaoAberta = null;
    history.back(); // sai da tela da seção
    render(); toast('Seção excluída');
  });
}

let secaoEditor = null;
function sheetItem(idItem, secaoId, escolher = false, valores = null){
  secaoEditor = secaoId || secaoAberta;
  const s = dados.secoes.find(x => x.id === secaoEditor);
  const it = idItem ? s.itens.find(i => i.id === idItem) : null;
  const v = valores || it || { dias: Regras.TODOS_OS_DIAS };
  const html = `
    <h2>${it ? 'Editar' : 'Adicionar'} ${esc(s.rotuloNome.toLowerCase())}</h2>
    ${escolher ? `<div class="sheet-campo"><span class="rotulo" id="rot-sec">Seção</span>
      <div class="chips" role="radiogroup" aria-labelledby="rot-sec">
        ${dados.secoes.map(x => `<button class="chip ${x.id === s.id ? 'on' : ''}" role="radio" aria-checked="${x.id === s.id}" onclick="trocarSecaoEditor('${x.id}')"><span>${esc(x.emoji)} ${esc(x.nome)}</span></button>`).join('')}
      </div></div>` : ''}
    <label>${esc(s.rotuloNome)}<input id="f-in" value="${esc(v.nome)}" placeholder="${s.rotuloNome==='Exercício'?'Ex.: Supino reto':s.rotuloNome==='Matéria'?'Ex.: Spring Data':''}"></label>
    <label>${esc(s.rotuloDetalhe)} (opcional)<input id="f-id" value="${esc(v.detalhe)}" placeholder="${s.rotuloDetalhe==='Carga'?'Ex.: 40 kg · 4x10':s.rotuloDetalhe==='Duração'?'Ex.: 1h':''}"></label>
    <label>Notas (opcional)<textarea id="f-notas" maxlength="1000" rows="2">${esc(v.notas)}</textarea></label>
    <label>Horário (opcional)<input id="f-hora" type="time" value="${esc(v.horario)}"></label>
    ${seletorDias(v.dias)}
    <button class="btn" onclick="salvarItem('${idItem||''}')">${it ? 'Salvar' : 'Adicionar'}</button>
    ${it ? `<button class="btn danger" onclick="excluirItem('${it.id}')">Excluir</button>` : ''}
  `;
  if(valores) abrirSheetOuAtualizar(html); else abrirSheet(html);
  document.querySelectorAll('#sheet input:not([type=time])').forEach(inp =>
    inp.addEventListener('keydown', e => { if(e.key === 'Enter') salvarItem(idItem||''); }));
}
const lerCamposItem = () => ({
  nome: document.getElementById('f-in').value, detalhe: document.getElementById('f-id').value,
  notas: document.getElementById('f-notas').value, horario: document.getElementById('f-hora').value, dias: diasMarcados(),
});
function trocarSecaoEditor(id){ sheetItem(null, id, true, lerCamposItem()); }
const NOMES_DIAS = ['segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado','domingo'];
function seletorDias(dias){
  return `<div class="sheet-campo"><span class="rotulo" id="rot-dias">Repetir</span>
    <div class="chips dias" role="group" aria-labelledby="rot-dias">
      ${['S','T','Q','Q','S','S','D'].map((l, i) => { const on = dias.includes(i + 1);
        return `<button class="chip ${on?'on':''}" data-dia="${i + 1}" aria-pressed="${on}" aria-label="${NOMES_DIAS[i]}" onclick="alternarDia(this)"><span>${l}</span></button>`; }).join('')}
    </div></div>`;
}
function alternarDia(b){
  const on = b.getAttribute('aria-pressed') !== 'true';
  b.setAttribute('aria-pressed', on); b.classList.toggle('on', on);
}
const diasMarcados = () => [...document.querySelectorAll('#sheet .dias .chip[aria-pressed="true"]')].map(b => +b.dataset.dia);
function salvarItem(idItem){
  const s = dados.secoes.find(x => x.id === secaoEditor);
  const nome = document.getElementById('f-in').value.trim();
  const detalhe = document.getElementById('f-id').value.trim();
  if(!nome){ toast('Preenche o campo ' + s.rotuloNome.toLowerCase()); return; }
  const notas = document.getElementById('f-notas').value.trim() || null;
  const horario = document.getElementById('f-hora').value || null;
  const dias = diasMarcados();
  if(!dias.length){ toast('Escolha pelo menos um dia'); return; }
  if(idItem){
    Object.assign(s.itens.find(i => i.id === idItem), { nome, detalhe, notas, horario, dias });
  } else {
    // conta a partir do dia que você está vendo (permite cadastrar algo que fez ontem)
    s.itens.push({ id: uid(), nome, detalhe, criadoEm: diaSel, notas, horario, dias });
  }
  salvar(); fecharSheet(); render(); toast('Tarefa salva');
}
function excluirItem(idItem){
  const s = dados.secoes.find(x => x.id === secaoEditor);
  s.itens = s.itens.filter(i => i.id !== idItem);
  Object.keys(dados.feitos).forEach(d => {
    dados.feitos[d] = dados.feitos[d].filter(x => x !== idItem);
    if(!dados.feitos[d].length) delete dados.feitos[d];
  });
  salvar(); fecharSheet(); render(); toast('Item excluído');
}

let acaoConfirmar = null;
function sheetConfirmar(titulo, texto, acao){
  acaoConfirmar = acao;
  abrirSheetOuAtualizar(`
    <h2>${esc(titulo)}</h2>
    <p class="hint">${esc(texto)}</p>
    <div class="row">
      <button class="btn ghost" onclick="fecharSheet()">Cancelar</button>
      <button class="btn danger" onclick="confirmarAgora()">Confirmar</button>
    </div>
  `);
}
function confirmarAgora(){
  const acao = acaoConfirmar; acaoConfirmar = null;
  document.getElementById('overlay').classList.remove('show');
  ignorarPop = true; history.back();
  // espera o "voltar" do sheet terminar antes de executar
  setTimeout(acao, 60);
}

/* ---------- backup ---------- */
function exportar(){
  const blob = new Blob([JSON.stringify(dados, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'rotina-backup-' + hoje() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  toast('Backup salvo em Downloads');
}
document.getElementById('arquivo').addEventListener('change', async e => {
  const f = e.target.files[0]; if(!f) return;
  try{
    const d = JSON.parse(await f.text());
    if(!Array.isArray(d.secoes)) throw 0;
    dados = { secoes: d.secoes, feitos: d.feitos || {} };
    salvar(); render(); toast('Backup restaurado ✓');
  }catch(err){ toast('Arquivo inválido'); }
  e.target.value = '';
});

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1900);
}

// quando o app volta do segundo plano num dia novo, atualiza o "Hoje"
let ultimoHoje = hoje();
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && hoje() !== ultimoHoje){
    if(diaSel === ultimoHoje) diaSel = hoje();
    ultimoHoje = hoje(); render();
  }
});

// faz funcionar offline e permite instalar como app
if('serviceWorker' in navigator){
  try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
}

function telaErro(){
  document.querySelector('nav.tabs').innerHTML = '';
  document.getElementById('app').innerHTML = `
    <div class="empty" role="alert">
      <p>Não foi possível carregar suas tarefas.</p>
      <button class="btn" onclick="iniciar()">Tentar novamente</button>
    </div>`;
}
function iniciar(){
  try{ dados = carregar(); }
  catch(e){ dados = null; console.error('Falha ao carregar os dados:', e && e.message); telaErro(); return; }
  montarNav(); render();
}
iniciar();
</script>
