const { fmt, somaDias, curto } = Regras;

function visao(){
  if(!ocultos.size) return dados;
  return { ...dados, secoes: dados.secoes.map(s => ({ ...s, itens: s.itens.filter(i => !ocultos.has(i.id)) })),
    tarefas: (dados.tarefas || []).filter(t => !ocultos.has(t.id)) };
}
const secaoVisivel = s => s && visao().secoes.find(x => x.id === s.id);

function carregar(){
  const bruto = localStorage.getItem(CHAVE);
  const { dados: d, migrou, deVersao } = Regras.migrar(bruto);
  if(migrou){
    const chaveBackup = 'backup_pre_v' + Regras.SCHEMA;
    if(deVersao < Regras.SCHEMA && localStorage.getItem(chaveBackup) === null) localStorage.setItem(chaveBackup, bruto);
    localStorage.setItem(CHAVE, JSON.stringify(d));
  }
  return d;
}

function marcarItem(idItem, dia, valor){
  const lista = dados.feitos[dia] || [];
  const tem = lista.includes(idItem);
  if(valor === tem) return;
  dados.feitos[dia] = valor ? [...lista, idItem] : lista.filter(x => x !== idItem);
  if(!dados.feitos[dia].length) delete dados.feitos[dia];
}
const tarefaPorId = id => (dados.tarefas || []).find(t => t.id === id);
const secaoDe = id => dados.secoes.find(s => s.id === id);
function estaFeita(tipo, id){
  if(tipo === 'tarefa'){ const t = tarefaPorId(id); return !!(t && t.completedAt); }
  return feito(diaSel, id);
}
function definirFeita(tipo, id, valor){
  if(tipo === 'tarefa'){
    const t = tarefaPorId(id); if(!t) return;
    const agora = new Date().toISOString();
    t.completedAt = valor ? agora : null; t.updatedAt = agora;
    return;
  }
  marcarItem(id, diaSel, valor);
}
let ultimoToque = null;
document.addEventListener('pointerdown', e => { ultimoToque = { x: e.clientX, y: e.clientY, alvo: e.target }; }, true);
function onda(item, x, y){
  if(!item || Animacoes.reduzido()) return;
  const r = item.getBoundingClientRect();
  const lado = Math.hypot(Math.max(x - r.left, r.right - x), Math.max(y - r.top, r.bottom - y)) * 2;
  const el = document.createElement('span');
  el.className = 'onda';
  el.style.cssText = `width:${lado}px;height:${lado}px;left:${x - r.left - lado / 2}px;top:${y - r.top - lado / 2}px`;
  item.appendChild(el);
  el.animate([{ transform: 'scale(0.2)', opacity: 0.16 }, { transform: 'scale(1)', opacity: 0 }], { duration: Animacoes.MOV.onda, easing: Animacoes.MOV.saida })
    .onfinish = () => el.remove();
}
function marcarComToque(e, tipo, id){
  const item = e.currentTarget.closest('.item');
  const vaiMarcar = !estaFeita(tipo, id);
  const pt = ultimoToque && item && item.contains(ultimoToque.alvo) ? ultimoToque : null;
  concluirEntrada(tipo, id);
  if(vaiMarcar){
    const r = item && item.getBoundingClientRect();
    if(r) onda(item, pt ? pt.x : r.left + r.width / 2, pt ? pt.y : r.top + r.height / 2);
  }
}
function marcarDuasLinhas(){

    b.classList.toggle('duas-linhas', b.scrollHeight > lh * 1.5);
  });
}
const segurando = new Set();
const timersMarcar = new Map();
const ESPERA_CONCLUIDAS = Animacoes.MOV.esperaConcluidas;
function concluirEntrada(tipo, id){
  const dia = diaSel;
  const valor = !estaFeita(tipo, id);
  definirFeita(tipo, id, valor);
  salvar();
  clearTimeout(timersMarcar.get(id));
  if(valor) segurando.add(id); else segurando.delete(id);
  render();
  if(valor){
    vibrar();
    snack('Tarefa concluída', () => { segurando.delete(id); const d0 = diaSel; diaSel = dia; definirFeita(tipo, id, false); diaSel = d0; salvar(); render(); });
    timersMarcar.set(id, setTimeout(() => {
      timersMarcar.delete(id);
      if(!segurando.has(id)) return;
      segurando.delete(id);
      const linha = document.querySelector(`#app .linha[data-id="${id}"]`);
      const fica = tela === 'secao';
      if(fica){ render(); return; }
      Animacoes.sair(linha, () => render());
    }, ESPERA_CONCLUIDAS));
  }
}
function apagarDeVez(tipo, id){
  if(tipo === 'tarefa'){ dados.tarefas = dados.tarefas.filter(t => t.id !== id); return; }
  dados.secoes.forEach(s => { s.itens = s.itens.filter(i => i.id !== id); });
  Object.keys(dados.feitos).forEach(d => {
    dados.feitos[d] = dados.feitos[d].filter(x => x !== id);
    if(!dados.feitos[d].length) delete dados.feitos[d];
  });
}
function excluirEntrada(tipo, id){
  ocultos.add(id); render();
  snack('Tarefa excluída',
    () => { ocultos.delete(id); render(); },
    () => { ocultos.delete(id); apagarDeVez(tipo, id); salvar(); render(); });
}
const alternar = idItem => concluirEntrada('item', idItem);

/* ---------- snackbar ---------- */
let snackAtual = null;
function esconderSnack(){
  const t = document.getElementById('toast');
  clearTimeout(t._h); t.classList.remove('show', 'com-acao');
}
function finalizarSnack(){
  const s = snackAtual; snackAtual = null; esconderSnack();
  if(s && s.aoExpirar) s.aoExpirar();
}
function desfazerSnack(){
  const s = snackAtual; snackAtual = null; esconderSnack();
  if(s && s.desfazer) s.desfazer();
}
function snack(msg, desfazer, aoExpirar){
  finalizarSnack();
  const t = document.getElementById('toast');
  t.innerHTML = `<span>${esc(msg)}</span>` + (desfazer ? '<button class="snack-acao" onclick="desfazerSnack()">Desfazer</button>' : '');
  t.classList.toggle('com-acao', !!desfazer);
  void t.offsetHeight; t.classList.add('show');
  snackAtual = { desfazer, aoExpirar };
  t._h = setTimeout(finalizarSnack, desfazer ? 5000 : 2000);
}
const toast = msg => snack(msg);

/* ---------- gestos: deslizar e toque longo ---------- */
let gesto = null, suprimirClique = false, menuAlvo = null;
function fimGesto(){
  if(!gesto) return;
  clearTimeout(gesto.timer);
  gesto.linha.classList.remove('arrastando');
  gesto = null;
}
document.addEventListener('pointerdown', e => {
  const linha = e.target.closest('.linha');
  if(!linha || e.button > 0) return;
  const item = linha.querySelector('.item');
  item.getAnimations().forEach(a => { a.commitStyles(); a.cancel(); });
  gesto = { linha, item, x: e.clientX, y: e.clientY, dx: 0, dy: 0, modo: null, id: e.pointerId, amostras: [[e.timeStamp, e.clientX]], cruzou: false };
  gesto.timer = setTimeout(() => {
    if(gesto && !gesto.modo){ gesto.modo = 'longo'; suprimirClique = true; vibrar(); abrirMenu(linha.dataset); }
  }, 500);
});
document.addEventListener('pointermove', e => {
  if(!gesto || e.pointerId !== gesto.id || gesto.modo === 'longo') return;
  const dx = e.clientX - gesto.x, dy = e.clientY - gesto.y;
  if(!gesto.modo){
    if(Math.abs(dx) < Animacoes.GESTO.trava && Math.abs(dy) < Animacoes.GESTO.trava) return;
    clearTimeout(gesto.timer);
    if(Animacoes.decidirGesto({ dx, dy, largura: gesto.linha.offsetWidth }) === 'rolar'){ fimGesto(); return; }
    gesto.modo = 'desliza'; gesto.linha.classList.add('arrastando');
    try{ gesto.linha.setPointerCapture(e.pointerId); }catch(err){}
  }
  const largura = gesto.linha.offsetWidth;
  const podeDir = gesto.linha.dataset.concluivel === '1';
  gesto.dx = podeDir ? dx : Math.min(dx, 0);
  gesto.dy = dy;
  gesto.amostras.push([e.timeStamp, e.clientX]);
  if(gesto.amostras.length > 8) gesto.amostras.shift();
  gesto.item.style.transform = `translateX(${Animacoes.elastico(gesto.dx, largura)}px)`;
  if(gesto.dx > 0) gesto.linha.dataset.dir = 'dir';
  else if(gesto.dx < 0) gesto.linha.dataset.dir = 'esq';
  const cruzou = Math.abs(gesto.dx) >= largura * Animacoes.GESTO.limite;
  if(cruzou && !gesto.cruzou) vibrar(8);
  gesto.cruzou = gesto.cruzou || cruzou;
  gesto.linha.classList.toggle('cruzou', cruzou);
});
function velocidadeGesto(g){
  const recentes = g.amostras.filter(([t]) => t >= g.amostras[g.amostras.length - 1][0] - 100);
  if(recentes.length < 2) return 0;
  const [t0, x0] = recentes[0], [t1, x1] = recentes[recentes.length - 1];
  return t1 > t0 ? (x1 - x0) / (t1 - t0) : 0;
}
function voltarItem(g){
  const de = g.item.style.transform;
  g.item.style.transform = '';
  const limpar = () => { delete g.linha.dataset.dir; g.linha.classList.remove('cruzou'); };
  if(!de || Animacoes.reduzido()){ limpar(); return; }
  const a = g.item.animate([{ transform: de }, { transform: 'none' }], { duration: Animacoes.MOV.lenta, easing: Animacoes.curvaMola() });
  a.onfinish = limpar;
}
function soltar(e){
  if(!gesto || e.pointerId !== gesto.id) return;
  const g = gesto; fimGesto();
  if(g.modo !== 'desliza') return;
  suprimirClique = true;
  const largura = g.linha.offsetWidth;
  const { tipo, id } = g.linha.dataset;
  const decisao = Animacoes.decidirGesto({ dx: g.dx, dy: 0, largura, velocidade: velocidadeGesto(g) });
  if(decisao === 'excluir'){
    const de = g.item.style.transform;
    g.item.style.transform = `translateX(${-largura}px)`;
    if(Animacoes.reduzido()){ excluirEntrada(tipo, id); return; }
    const a = g.item.animate([{ transform: de }, { transform: `translateX(${-largura}px)` }], { duration: Animacoes.MOV.base, easing: Animacoes.MOV.entrada });
    a.onfinish = () => excluirEntrada(tipo, id);
    return;
  }
  if(decisao === 'marcar') concluirEntrada(tipo, id);
  voltarItem(g);
}
document.addEventListener('pointerup', soltar);
document.addEventListener('pointercancel', e => {
  if(!gesto || e.pointerId !== gesto.id) return;
  const g = gesto; fimGesto();
  if(g.modo === 'desliza') voltarItem(g);
});

let dicaAgendada = false;
function talvezMostrarDica(){
  if(dicaAgendada || tela !== 'rotina' || dados.ajustes.dicaGestoVista) return;
  const linha = document.querySelector('#app .linha[data-concluivel="1"]');
  if(!linha) return;
  dicaAgendada = true;
  dados.ajustes.dicaGestoVista = true; salvar();
  if(Animacoes.reduzido()) return;
  setTimeout(() => {
    const atual = document.querySelector(`#app .linha[data-id="${linha.dataset.id}"]`);
    if(!atual || gesto) return;
    const item = atual.querySelector('.item');
    const M = Animacoes.MOV;
    atual.dataset.dir = 'dir';
    const a = item.animate([
      { transform: 'translateX(0)', easing: M.saida },
      { transform: `translateX(${M.dicaDistancia}px)`, offset: 0.4, easing: Animacoes.curvaMola() },
      { transform: 'translateX(0)' },
    ], { duration: M.dicaDuracao });
    a.onfinish = a.oncancel = () => { delete atual.dataset.dir; };
  }, Animacoes.MOV.dicaAtraso);
}

function abrirMenu(d){
  menuAlvo = { ...d };
  const s = dados.secoes.find(x => x.id === d.sid);
  const it = d.tipo === 'tarefa' ? tarefaPorId(d.id) : s && s.itens.find(i => i.id === d.id);
  if(!it) return;
  const nomeMenu = d.tipo === 'tarefa' ? it.title : it.nome;
  const concluir = d.concluivel === '1' ? `<button onclick="menuAcao('concluir')">${ic('check')}${estaFeita(d.tipo, d.id) ? 'Desmarcar' : 'Concluir'}</button>` : '';
  abrirSheetOuAtualizar(`
    <h2 class="menu-tit">${esc(nomeMenu)}</h2>
    <div class="menu">
      ${concluir}
      <button onclick="menuAcao('editar')">${ic('editar')}Editar</button>
      <button class="perigo" onclick="menuAcao('excluir')">${ic('excluir')}Excluir</button>
    </div>`);
}
function menuAcao(acao){
  const d = menuAlvo;
  if(acao === 'editar'){ if(d.tipo === 'tarefa') editarTarefa(d.id); else sheetItem(d.id, d.sid); return; }
  fecharSheet();
  setTimeout(() => acao === 'concluir' ? concluirEntrada(d.tipo, d.id) : excluirEntrada(d.tipo, d.id), 60);
}

/* ---------- navegação (botão voltar do Android funciona) ---------- */
function irPara(t){
  if(t === tela){ scrollTo(0,0); return; }
  const deHoje = tela === 'rotina';
  const volta = tela === 'secao' || t === 'rotina';
  tela = t; secaoAberta = null; render(); scrollTo(0,0);
  if(volta){
    ignorarPop = true; history.back();
    if(t !== 'rotina') setTimeout(() => history.pushState({aba:t}, ''), 60);
  } else if(deHoje) history.pushState({aba:t}, '');
}
function abrirSecao(id){
  secaoAberta = id; tela = 'secao';
  history.pushState({secao:id}, '');
  render(); scrollTo(0,0);
}
let ignorarPop = false; // true quando nós mesmos chamamos history.back() pra fechar uma janela
addEventListener('popstate', () => {
  if(ignorarPop){ ignorarPop = false; return; }
  if(document.getElementById('dialogo').classList.contains('show')){
    if(!dlgComEntrada) history.pushState({sheet:true}, '');
    dlgComEntrada = false; fecharDialogo(true); return;
  }
  if(document.getElementById('overlay').classList.contains('show')){
    if(ed && editorAlterado()){ history.pushState({sheet:true}, ''); pedirDescartar(); return; }
    ed = null; fecharSheet(true); return;
  }
  if(tela !== 'rotina'){ tela = 'rotina'; secaoAberta = null; render(); scrollTo(0,0); }
});

/* ---------- telas ---------- */
let telaDesenhada = '';
function render(refazer = false){
  if(!dados) return;
  ABAS.forEach(([t]) => {
    const on = t === tela || (t==='rotina' && tela==='secao');
    const b = document.getElementById('tab-'+t);
    b.classList.toggle('on', on);
    if(on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  const app = document.getElementById('app');
  app.classList.toggle('com-fab', tela === 'rotina' || tela === 'proximos');
  const html = tela === 'rotina' ? telaHoje() : tela === 'proximos' ? telaProximos() : tela === 'secao' ? telaSecao()
    : tela === 'constancia' ? telaProgresso() : telaAjustes();
  const chaveTela = tela + ':' + (secaoAberta || '') + ':' + diaSel;
  if(!refazer && telaDesenhada === chaveTela) Animacoes.flip(app, () => Animacoes.mesclarHtml(app, html));
  else { app.innerHTML = html; telaDesenhada = chaveTela; }
  if(tela === 'ajustes') atualizarEstadoNotif();
  marcarDuasLinhas();
  talvezMostrarDica();
}

function seletorDia(){
  return `<div class="day">
    <button class="icon-btn" onclick="mudarDia(-1)" aria-label="Dia anterior">${ic('anterior')}</button>
    <span>${nomeDia(diaSel)}</span>
    <button class="icon-btn" onclick="mudarDia(1)" ${diaSel >= hoje() ? 'disabled' : ''} aria-label="Próximo dia">${ic('proximo')}</button>
  </div>`;
}
function mudarDia(n){ const d = somaDias(diaSel, n); if(d <= hoje()){ diaSel = d; render(); } }

let concluidasAbertas = false;
const dois = n => String(n).padStart(2, '0');
const horaAgora = () => { const d = new Date(); return dois(d.getHours()) + ':' + dois(d.getMinutes()); };
function anel(feitas, total){
  if(!total) return '';
  const pct = Math.round(feitas / total * 100);
  return `<div class="anel" role="img" aria-label="${feitas} de ${total} concluídas">
    <svg viewBox="0 0 48 48" aria-hidden="true"><circle class="trilho" cx="24" cy="24" r="21.5"/><circle class="arco ${pct ? '' : 'zero'}" cx="24" cy="24" r="21.5" pathLength="100" stroke-dasharray="100" style="stroke-dashoffset:${100 - pct}"/></svg>
    <span aria-hidden="true">${feitas} de ${total}</span></div>`;
}
function linhaHoje(s, i, comSecao){
  const partes = [];
  if(i.horario){
    const passou = diaSel === hoje() && !feito(diaSel, i.id) && i.horario < horaAgora();
    partes.push(passou ? `<span class="passou">${esc(i.horario)}, já passou</span>` : esc(i.horario));
  }
  if(comSecao) partes.push(`<span class="cat"><i class="ponto"></i>${esc(s.nome)}</span>`);
  if(i.detalhe) partes.push(esc(s.rotuloDetalhe) + ': ' + esc(i.detalhe));
  if(i.dias.length < 7) partes.push(`<span class="rep">${ic('repetir','sm')}${Regras.resumoDias(i.dias)}</span>`);
  if(i.horario && i.lembreteMin != null) partes.push(`<span class="rep">${ic('sino','sm')}<span class="sr">Com lembrete</span></span>`);
  return partes.length ? `<small>${partes.join(' · ')}</small>` : '';
}
const CHECK_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path pathLength="1" d="M5 12.5l4.2 4.2L19 7"/></svg>';
const fundoLinha = f => `<div class="fundo" aria-hidden="true"><span class="lado-esq">${ic('check')}${f ? 'Desmarcar' : 'Concluir'}</span><span class="lado-dir">Excluir${ic('excluir')}</span></div>`;
function linhaTarefa(t, o){
  const partes = [];
  const s = secaoDe(t.categoryId);
  if(o.data && t.dueDate) partes.push(`<span class="${Regras.atrasada(t, hoje()) ? 'passou' : ''}">${Regras.rotuloDia(t.dueDate, hoje())}</span>`);
  if(t.dueTime){
    const passou = t.dueDate === hoje() && !t.completedAt && t.dueTime < horaAgora();
    partes.push(passou ? `<span class="passou">${esc(t.dueTime)}, já passou</span>` : esc(t.dueTime));
  }
  if(o.secao && s) partes.push(`<span class="cat"><i class="ponto"></i>${esc(s.nome)}</span>`);
  if(t.priority === 'high') partes.push(`<span class="prio">${ic('bandeira','sm')}Alta</span>`);
  if(t.dueTime && t.reminderOffsetMin != null) partes.push(`<span class="rep">${ic('sino','sm')}<span class="sr">Com lembrete</span></span>`);
  return partes.length ? `<small>${partes.join(' · ')}</small>` : '';
}
function itemTarefa(t, o = {}){
  const s = secaoDe(t.categoryId);
  const f = !!(tarefaPorId(t.id) || t).completedAt;
  return `<div class="linha" data-tipo="tarefa" data-id="${t.id}" data-sid="${s ? s.id : ''}" data-concluivel="1">
    ${fundoLinha(f)}
    <div class="item ${f ? 'done' : ''} ${t.priority === 'high' ? 'alta' : ''}" style="--c:${s ? corDe(s) : 'var(--primary)'}">
      <button class="check" aria-pressed="${f}" aria-label="${esc(t.title)}, ${f ? 'feito' : 'não feito'}" onclick="marcarComToque(event,'tarefa','${t.id}')"><i>${CHECK_SVG}</i></button>
      <div class="info" onclick="marcarComToque(event,'tarefa','${t.id}')">
        <b>${esc(t.title)}</b>${linhaTarefa(t, o)}
      </div>
      <button class="sr" onclick="abrirMenu(this.closest('.linha').dataset)">Mais ações: ${esc(t.title)}</button>
    </div>
  </div>`;
}
const linhaEntrada = (e, s, comSecao) => e.tipo === 'item' ? itemHoje(s, e.obj, comSecao) : itemTarefa(e.obj, { secao: comSecao });
const entradaFeita = e => !segurando.has(e.obj.id) && (e.tipo === 'item' ? feito(diaSel, e.obj.id) : !!e.obj.completedAt);
function itemHoje(s, i, comSecao, concluivel = true){
  const f = feito(diaSel, i.id);
  return `<div class="linha" data-tipo="item" data-id="${i.id}" data-sid="${s.id}" data-concluivel="${concluivel ? 1 : 0}">
    ${fundoLinha(f)}
    <div class="item ${f ? 'done' : ''}" style="--c:${corDe(s)}">
      ${concluivel ? `<button class="check" aria-pressed="${f}" aria-label="${esc(i.nome)}, ${f ? 'feito' : 'não feito'}" onclick="marcarComToque(event,'item','${i.id}')"><i>${CHECK_SVG}</i></button>` : ''}
      <div class="info ${concluivel ? '' : 'sem-check'}" ${concluivel ? `onclick="marcarComToque(event,'item','${i.id}')"` : `role="button" tabindex="0" onclick="sheetItem('${i.id}','${s.id}')" onkeydown="teclaBotao(event, this)"`}>
        <b>${esc(i.nome)}</b>${linhaHoje(s, i, comSecao)}
      </div>
      <button class="sr" onclick="abrirMenu(this.closest('.linha').dataset)">Mais ações: ${esc(i.nome)}</button>
    </div>
  </div>`;
}
function telaHoje(){
  const r = resumoDia(diaSel);
  const ehHoje = diaSel === hoje();
  const vis = visao();
  const tarefasDia = vis.tarefas.filter(t => t.dueDate === diaSel);
  const atrasadas = ehHoje ? Regras.ordenarAtrasadas(vis.tarefas.filter(t => Regras.atrasada(t, diaSel))) : [];
  const grupos = [], concluidas = [];
  const montarGrupo = (s, entradas, cabecalho) => {
    const pendentes = entradas.filter(e => !entradaFeita(e));
    entradas.filter(entradaFeita).forEach(e => concluidas.push([s, e]));
    if(pendentes.length) grupos.push(cabecalho(pendentes));
  };
  dados.secoes.forEach(s => {
    const entradas = Regras.ordenarDia(Regras.ordenarItens(itensDoDia(diaSel, s)), tarefasDia.filter(t => t.categoryId === s.id));
    montarGrupo(s, entradas, pendentes => {
      const rs = resumoDia(diaSel, s);
      return `<section class="grupo tinta" data-chave="g-${s.id}" style="${tintaDe(s)}">
        <button class="grupo-top" onclick="abrirSecao('${s.id}')" aria-label="Abrir ${esc(s.nome)}, ${rs.feitas} de ${rs.total} feitas">
          <span class="emo" aria-hidden="true">${esc(s.emoji)}</span><span class="nm">${esc(s.nome)}</span><span class="cont">${rs.feitas} de ${rs.total}</span>${ic('proximo','sm')}
        </button>
        <div class="lista">${pendentes.map(e => linhaEntrada(e, s, false)).join('')}</div>
      </section>`;
    });
  });
  const semSecao = tarefasDia.filter(t => !secaoDe(t.categoryId));
  montarGrupo(null, Regras.ordenarDia([], semSecao), pendentes => `<section class="grupo" data-chave="sem-secao">
      <h2 class="grupo-top"><span class="nm">Sem seção</span><span class="cont">${semSecao.filter(t => t.completedAt).length} de ${semSecao.length}</span></h2>
      <div class="lista">${pendentes.map(e => linhaEntrada(e, null, false)).join('')}</div>
    </section>`);
  const blocoAtrasadas = atrasadas.length ? `<section class="grupo" data-chave="atrasadas">
      <h2 class="grupo-top"><span class="nm">Atrasadas</span><span class="cont">${atrasadas.length}</span></h2>
      <div class="lista">${atrasadas.map(t => itemTarefa(t, { data: true, secao: true })).join('')}</div>
    </section>` : '';
  concluidas.sort(([, a], [, b]) => (a.tipo === 'tarefa') - (b.tipo === 'tarefa') || String(b.obj.completedAt || '').localeCompare(String(a.obj.completedAt || '')));
  let corpo;
  if(!r.total){
    const boasVindas = NATIVO && !dados.secoes.length && !dados.tarefas.length && !dados.ajustes.boasVindasOk ? `<div class="card boas-vindas" data-chave="boas-vindas">
      <h2>Já usava o Minha Rotina no navegador?</h2>
      <p class="hint">No app antigo, abra Ajustes e toque em Exportar tarefas. Depois importe o arquivo aqui para trazer tudo.</p>
      <div class="row mt"><button class="btn" onclick="importarBackup()">Importar backup</button><button class="btn ghost" onclick="dados.ajustes.boasVindasOk=true;salvar();render()">Começar do zero</button></div>
    </div>` : '';
    corpo = boasVindas + blocoAtrasadas + `<div class="vazio" data-chave="vazio">${ic('calendario','lg')}<p>${ehHoje ? 'Nenhuma tarefa para hoje.' : 'Nenhuma tarefa neste dia.'}</p>
      <button class="btn" onclick="novaTarefa()">Adicionar tarefa</button></div>`;
  } else {
    const tudo = r.feitas === r.total ? `<div class="vazio tudo-feito" data-chave="tudo-feito" role="status">${ic('hoje','lg')}<p><b>${ehHoje ? 'Tudo feito por hoje' : 'Tudo feito neste dia'}</b><br><small>${r.feitas} de ${r.total} concluídas</small></p></div>` : '';
    const listaConcl = concluidas.length ? `<section class="grupo" data-chave="concluidas">
      <button class="grupo-top" aria-expanded="${concluidasAbertas}" onclick="concluidasAbertas=!concluidasAbertas;render()">
        <span class="nm">Concluídas (${concluidas.length})</span>${ic('expandir','sm')}
      </button>
      ${concluidasAbertas ? `<div class="lista">${concluidas.map(([s, e]) => linhaEntrada(e, s, true)).join('')}</div>` : ''}
    </section>` : '';
    corpo = tudo + blocoAtrasadas + grupos.join('') + listaConcl;
  }
  return `
    <header class="hoje-top">
      <div class="hoje-tit">
        <h1>${ehHoje ? 'Hoje' : Regras.rotuloDia(diaSel, hoje())}</h1>
        <div class="hoje-data">
          <span>${Regras.dataExtenso(diaSel)}</span>
          <span class="setas">
            <button class="icon-btn" onclick="mudarDia(-1)" aria-label="Dia anterior">${ic('anterior')}</button>
            <button class="icon-btn" onclick="mudarDia(1)" ${ehHoje ? 'disabled' : ''} aria-label="Próximo dia">${ic('proximo')}</button>
          </span>
        </div>
      </div>
      ${anel(r.feitas, r.total)}
    </header>
    ${corpo}
    <button class="btn text nova-secao" onclick="sheetSecao()">${ic('add')} Nova seção</button>
    <button class="fab" onclick="novaTarefa()">${ic('add')}<span>Nova tarefa</span></button>
  `;
}
function novaTarefa(){ abrirEditor({ novo: true, repetir: 'nao', data: hoje() }); }
function novaTarefaSemData(){ abrirEditor({ novo: true, repetir: 'nao', data: '' }); }
function editarTarefa(id){ abrirEditor({ tipo: 'tarefa', id }); }

let busca = '', filtroProx = 'todas';
function telaProximos(){
  const chip = (id, rotulo) => `<button class="chip ${filtroProx === id ? 'on' : ''}" role="radio" aria-checked="${filtroProx === id}" onclick="filtroProx='${id}';render()"><span>${rotulo}</span></button>`;
  return `
    <header class="top"><h1>Próximos</h1></header>
    <div class="busca">${ic('buscar')}<label class="sr" for="f-busca">Buscar tarefas</label>
      <input id="f-busca" type="search" placeholder="Buscar tarefas" value="${esc(busca)}" autocomplete="off" oninput="busca=this.value;atualizarProximos()"></div>
    <div class="chips filtros" role="radiogroup" aria-label="Filtrar tarefas">
      ${chip('todas', 'Todas')}${dados.secoes.map(s => chip(s.id, esc(s.emoji) + ' ' + esc(s.nome))).join('')}${chip('alta', 'Alta prioridade')}
    </div>
    <div id="prox-lista">${listaProximos()}</div>
    <button class="fab" onclick="novaTarefaSemData()">${ic('add')}<span>Nova tarefa</span></button>
  `;
}
function listaProximos(){
  let ts = visao().tarefas.map(t => segurando.has(t.id) ? { ...t, completedAt: null } : t);
  if(filtroProx === 'alta') ts = ts.filter(t => t.priority === 'high');
  else if(filtroProx !== 'todas') ts = ts.filter(t => t.categoryId === filtroProx);
  if(busca.trim()){
    const r = Regras.buscarTarefas(ts, busca);
    return r.length ? `<section class="grupo" data-chave="resultados"><h2 class="grupo-top"><span class="nm">Resultados</span><span class="cont">${r.length}</span></h2>
      <div class="lista">${r.map(t => itemTarefa(t, { data: true, secao: true })).join('')}</div></section>`
      : '<div class="vazio"><p>Nenhuma tarefa encontrada.</p></div>';
  }
  const g = Regras.gruposProximos(ts, hoje());
  if(!g.length) return `<div class="vazio">${ic('calendario','lg')}<p>Nada planejado para os próximos dias.</p></div>`;
  return g.map(x => `<section class="grupo" data-chave="p-${x.chave}"><h2 class="grupo-top"><span class="nm">${esc(x.titulo)}</span></h2>
    <div class="lista">${x.tarefas.map(t => itemTarefa(t, { data: x.chave === 'depois', secao: true })).join('')}</div></section>`).join('');
}
function atualizarProximos(){ const el = $('prox-lista'); if(el) el.innerHTML = listaProximos(); }

function linhaItem(s, i){
  const partes = [];
  if(i.horario) partes.push(esc(i.horario));
  if(i.detalhe) partes.push(esc(s.rotuloDetalhe) + ': ' + esc(i.detalhe));
  if(Array.isArray(i.dias) && i.dias.length && i.dias.length < 7) partes.push(Regras.resumoDias(i.dias));
  return partes.length ? `<small>${partes.join(' · ')}</small>` : '';
}
function telaSecao(){
  const s = dados.secoes.find(x => x.id === secaoAberta);
  if(!s){ tela = 'rotina'; return telaHoje(); }
  const r = resumoDia(diaSel, s);
  const visiveis = s.itens.filter(i => !ocultos.has(i.id));
  const itens = visiveis.filter(i => i.criadoEm <= diaSel && Regras.repeteNoDia(i, diaSel));
  const outros = visiveis.filter(i => !itens.includes(i));
  const lista = itens.length ? `<div class="lista tinta" style="${tintaDe(s)}">${Regras.ordenarItens(itens).map(i => itemHoje(s, i, false)).join('')}</div>` : '';
  const listaOutros = outros.length ? `<div class="lista tinta" style="${tintaDe(s)}">${outros.map(i => itemHoje(s, i, false, false)).join('')}</div>` : '';
  return `
    <header class="top">
      <button class="icon-btn" onclick="history.back()" aria-label="Voltar">${ic('voltar')}</button>
      <h1>${esc(s.emoji)} ${esc(s.nome)}</h1>
      <button class="icon-btn" onclick="sheetSecao('${s.id}')" aria-label="Editar seção">${ic('editar')}</button>
    </header>
    ${seletorDia()}
    <div class="summary tinta" style="${tintaDe(s)}">
      <div class="big">${r.pct}%</div>
      <small>${r.feitas} de ${r.total} feitas · ${nomeDia(diaSel).toLowerCase()}</small>
      <div class="bar"><i style="--p:${r.pct / 100}"></i></div>
    </div>
    ${lista || `<p class="empty">${visiveis.length ? 'Nada desta seção para ' + nomeDia(diaSel).toLowerCase() + '.' : 'Nenhum item. Adicione o primeiro ' + esc(s.rotuloNome.toLowerCase()) + '.'}</p>`}
    ${listaOutros ? `<h2 class="secao-titulo">Outros dias</h2>${listaOutros}` : ''}
    <button class="btn mt" onclick="sheetItem()">${ic('add')} Adicionar ${esc(s.rotuloNome.toLowerCase())}</button>
  `;
}

function telaProgresso(){
  const vis = visao();
  const total = Regras.totalConcluidas(vis);
  if(!total) return `<header class="top"><h1>Progresso</h1></header>
    <div class="vazio">${ic('grafico','lg')}<p>Conclua sua primeira tarefa para ver seu progresso.</p></div>`;

  const seq = Regras.sequencia(vis, hoje());
  const taxa = Regras.taxaSemana(vis, hoje());
  const semana = Regras.barrasSemana(vis, hoje());
  const maxSemana = Math.max(1, ...semana.map(b => b.valor));
  const letras = ['S','T','Q','Q','S','S','D'];
  const barrasSemana = semana.map((b, i) => `
    <div class="col" role="img" aria-label="${Regras.DIAS_LONGOS[i]}, ${b.valor} ${b.valor === 1 ? 'tarefa concluída' : 'tarefas concluídas'}">
      <div class="b ${b.valor ? '' : 'zero'} ${b.hoje ? 'hoje' : ''}" style="height:${b.valor / maxSemana * 100}%"><span aria-hidden="true">${b.valor}</span></div>
      <div class="lbl ${b.hoje ? 'hoje' : ''}" aria-hidden="true">${letras[i]}</div>
    </div>`).join('');

  const dias = [];
  for(let i = periodo - 1; i >= 0; i--) dias.push(somaDias(hoje(), -i));
  const resumos = dias.map(d => ({ d, ...resumoDia(d) }));
  const comTarefa = resumos.filter(r => r.total);
  const tot = comTarefa.reduce((a,r) => a + r.total, 0);
  const fei = comTarefa.reduce((a,r) => a + r.feitas, 0);
  const media = tot ? Math.round(fei / tot * 100) : 0;
  const melhor = comTarefa.length ? Math.max(...comTarefa.map(r => r.pct)) : 0;
  const passo = periodo > 14 ? 5 : 1;
  const barras = resumos.map((r, idx) => `
    <div class="col" role="img" aria-label="${Regras.dataCurta(r.d)}, ${r.total ? r.pct + '%' : 'sem tarefas'}">
      <div class="b ${r.pct ? '' : 'zero'}" style="height:${r.pct}%">
        ${periodo <= 14 && r.total ? `<span aria-hidden="true">${r.pct}%</span>` : ''}
      </div>
      <div class="lbl" aria-hidden="true">${(idx % passo === 0 || idx === resumos.length - 1) ? curto(r.d) : '&nbsp;'}</div>
    </div>`).join('');
  const porSecao = dados.secoes.map(s => {
    let t = 0, fe = 0;
    dias.forEach(d => { const r = resumoDia(d, s); t += r.total; fe += r.feitas; });
    const p = t ? Math.round(fe / t * 100) : 0;
    return `<div class="secstat" style="--c:${corDe(s)}">
      <div class="top"><span>${esc(s.emoji)} ${esc(s.nome)}</span><b>${p}%</b></div>
      <div class="bar"><i style="--p:${p / 100}"></i></div>
    </div>`;
  }).join('');

  return `
    <header class="top"><h1>Progresso</h1></header>
    <div class="cartoes">
      <div class="cartao-num destaque">${ic('fogo')}<b>${seq}</b><span>${Regras.textoSequencia(seq)}</span></div>
      <div class="cartao-num">${ic('grafico')}<b>${taxa.pct === null ? '—' : taxa.pct + '%'}</b><span>${Regras.textoTaxa(taxa.pct)}</span></div>
    </div>
    <div class="card">
      <h2>Concluídas por dia nesta semana</h2>
      <div class="chart semana">${barrasSemana}</div>
    </div>
    <div class="card total-card"><span>Concluídas no total:</span><b>${total}</b></div>

    <h2 class="titulo-bloco">Histórico</h2>
    <div class="seg" role="radiogroup" aria-label="Período">
      ${[7,30,90].map(p => `<button role="radio" aria-checked="${p===periodo}" class="${p===periodo?'on':''}" onclick="periodo=${p};render()">${p} dias</button>`).join('')}
    </div>
    <div class="summary">
      <small>Nos últimos ${periodo} dias você cumpriu</small>
      <div class="big">${media}%</div>
      <small>${fei} de ${tot} tarefas</small>
      <div class="bar"><i style="--p:${media / 100}"></i></div>
    </div>
    <div class="stats dois">

function pedirApagarTudo(){
  mostrarDialogo({ titulo: 'Apagar tudo?', texto: 'Apaga todas as seções, tarefas e o histórico. Não dá para desfazer.', cancelar: 'Cancelar', ok: 'Apagar tudo', perigo: true,
    acao: () => { finalizarSnack(); dados = { ...Regras.vazio(), ajustes: dados.ajustes }; salvar(); render(); toast('Tudo apagado'); } });
}
function textoExcluirSecao(s){
  const n = s.itens.length, m = dados.tarefas.filter(t => t.categoryId === s.id).length;
  const partes = [];
  if(n) partes.push(n === 1 ? 'O item da rotina dela e o histórico serão apagados.' : `Os ${n} itens da rotina dela e o histórico serão apagados.`);
  if(m) partes.push(m === 1 ? 'A tarefa avulsa dela ficará sem seção.' : `As ${m} tarefas avulsas dela ficarão sem seção.`);
  return partes.join(' ');
}
function apagarSecao(id){
  finalizarSnack();
  const s = secaoDe(id); if(!s) return;
  const ids = new Set(s.itens.map(i => i.id));
  dados.secoes = dados.secoes.filter(x => x.id !== id);
  dados.tarefas.forEach(t => { if(t.categoryId === id) t.categoryId = null; });
  Object.keys(dados.feitos).forEach(d => {
    dados.feitos[d] = dados.feitos[d].filter(x => !ids.has(x));
    if(!dados.feitos[d].length) delete dados.feitos[d];
  });
  if(filtroProx === id) filtroProx = 'todas';
  salvar();
}
function pedirExcluirSecao(id){

    acao: () => { apagarSecao(id); render(); toast('Seção excluída'); } });
}

/* ---------- janelas (bottom sheets) ---------- */
function abrirSheet(html, cheia = false){
  document.getElementById('sheet').classList.toggle('cheia', cheia);

  document.getElementById('overlay').classList.add('show');
  history.pushState({sheet:true}, '');
  const primeiro = document.querySelector('#sheet input');
  if(primeiro && !primeiro.value) setTimeout(() => primeiro.focus(), 80);
  else setTimeout(() => { if(!document.getElementById('sheet').contains(document.activeElement)){ const b = document.querySelector('#sheet button, #sheet input, #sheet textarea'); if(b) b.focus({ preventScroll: true }); } }, 80);
}

}

  lerSecao();

  if(erroNome){ toast(erroNome); return; }
  const { modelo, ...s } = rascunho;
  if(editando){
    const i = dados.secoes.findIndex(x => x.id === s.id);
    dados.secoes[i] = { ...dados.secoes[i], ...s };

function editorSaiuTitulo(){ if(!ed) return; ed.tocouTitulo = true; mostrarErroTitulo(); }
function mostrarErroTitulo(){
  const e = Regras.validarTitulo($('f-in').value);
  $('erro-titulo').textContent = e || '';
  $('f-in').setAttribute('aria-invalid', !!e);
}
function editorSecao(id){ lerEditor(); ed.v.sid = id || null; ed.erroSecao = ''; desenharEditor(false); }
function criarSecaoEditor(){
  lerEditor();
  const nome = ed.ns.nome.trim();
  const erro = Regras.validarNomeSecao(nome, dados.secoes);
  if(erro){ ed.erroSecao = erro; desenharEditor(false); $('f-ns').focus(); return; }
  const nova = { id: uid(), nome, emoji: '⭐', corToken: ed.ns.cor, rotuloNome: 'Tarefa', rotuloDetalhe: 'Detalhe', itens: [] };
  dados.secoes.push(nova); salvar();
  ed.v.sid = nova.id; ed.novaSecao = false; ed.erroSecao = ''; ed.ns = { nome: '', cor: 'green' };
  desenharEditor(false);
}
function cancelarEditor(){ if(editorAlterado()) pedirDescartar(); else fecharEditor(); }
function fecharEditor(){ ed = null; fecharSheet(); }
let dlgComEntrada = false, dlgAcao = null;
function mostrarDialogo({ titulo, texto = '', cancelar, ok, perigo = false, acao }){
  dlgAcao = acao;
  dlgComEntrada = !document.getElementById('overlay').classList.contains('show');
  if(dlgComEntrada) history.pushState({dlg:true}, '');
  $('dlg-caixa').innerHTML = `<h2 id="dlg-tit">${esc(titulo)}</h2>${texto ? `<p>${esc(texto)}</p>` : ''}
    <div class="dlg-acoes">
      <button class="btn text" id="dlg-cancelar" onclick="dialogoCancelar()">${esc(cancelar)}</button>
      <button class="btn text ${perigo ? 'danger' : ''}" onclick="dialogoOk()">${esc(ok)}</button>
    </div>`;
  $('dialogo').classList.add('show');
  setTimeout(() => $('dlg-cancelar').focus(), 50);
}
function fecharDialogo(vindoDoVoltar){
  $('dialogo').classList.remove('show');
  if(dlgComEntrada && !vindoDoVoltar){ ignorarPop = true; history.back(); }
  dlgComEntrada = false;
}
function dialogoCancelar(){ dlgAcao = null; fecharDialogo(); }
function dialogoOk(){ const a = dlgAcao; dlgAcao = null; fecharDialogo(); if(a) setTimeout(a, 60); }
function pedirDescartar(){
  mostrarDialogo({ titulo: 'Descartar alterações?', cancelar: 'Continuar editando', ok: 'Descartar', perigo: true, acao: fecharEditor });
}
function excluirDoEditor(){
  const { tipo, id } = ed;
  ed = null; fecharSheet();
  setTimeout(() => excluirEntrada(tipo, id), 60);
}
function salvarEditor(){
  lerEditor();
  const v = ed.v;
  const rotina = ehRotina();
  ed.tocouTitulo = true;
  const erro = Regras.validarTitulo(v.nome);
  ed.erroSecao = rotina && !v.sid ? 'Escolha ou crie uma seção.' : '';
  ed.erroDias = rotina && !v.dias.length ? 'Escolha pelo menos um dia.' : '';
  if(erro || ed.erroSecao || ed.erroDias){ desenharEditor(false); if(erro) $('f-in').focus(); return; }
  const notas = v.notas.trim().slice(0, 1000) || null;
  if(rotina){
    const campos = { nome: v.nome.trim(), detalhe: v.detalhe.trim(), notas, horario: v.horario || null, lembreteMin: v.horario ? v.lembrete : null, dias: v.repetir === 'todo' ? Regras.TODOS_OS_DIAS.slice() : v.dias };
    const destino = secaoDe(v.sid);
    if(ed.id){
      const origem = secaoDe(ed.sidOriginal);
      const it = origem.itens.find(i => i.id === ed.id);
      Object.assign(it, campos);
      if(origem !== destino){ origem.itens = origem.itens.filter(i => i !== it); destino.itens.push(it); }
    } else {
      destino.itens.push({ id: uid(), ...campos, criadoEm: diaSel });
    }
  } else {
    const agora = new Date().toISOString();
    const campos = { title: v.nome.trim(), notes: notas, dueDate: v.data || null, dueTime: v.data ? (v.horario || null) : null, reminderOffsetMin: v.data && v.horario ? v.lembrete : null, priority: v.prioridade, categoryId: v.sid || null };
    if(ed.id) Object.assign(tarefaPorId(ed.id), campos, { updatedAt: agora });
    else dados.tarefas.push({ id: uid(), ...campos, completedAt: null, createdAt: agora, updatedAt: agora });
  }
  salvar(); fecharEditor(); render(); toast('Tarefa salva');
}
const NOMES_DIAS = ['segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado','domingo'];
function seletorDias(dias){
  return `
    <div class="chips dias" role="group" aria-label="Dias da semana">
      ${['S','T','Q','Q','S','S','D'].map((l, i) => { const on = dias.includes(i + 1);
        return `<button class="chip ${on?'on':''}" data-dia="${i + 1}" aria-pressed="${on}" aria-label="${NOMES_DIAS[i]}" onclick="alternarDia(this)"><span>${l}</span></button>`; }).join('')}
    </div>`;
}
function alternarDia(b){
  const on = b.getAttribute('aria-pressed') !== 'true';
  b.setAttribute('aria-pressed', on); b.classList.toggle('on', on);
}
const diasMarcados = () => [...document.querySelectorAll('#sheet .dias .chip[aria-pressed="true"]')].map(b => +b.dataset.dia);


/* ---------- backup ---------- */
function arquivoBackup(){
  const texto = JSON.stringify(Regras.montarBackup(dados, new Date().toISOString()), null, 2);
  return new File([texto], 'rotina-backup-' + hoje() + '.json', { type: 'application/json' });
}
async function exportarNativo(){
  const nome = 'rotina-backup-' + hoje() + '.json';
  try{
    const r = await plugin('Filesystem').writeFile({ path: nome, data: JSON.stringify(Regras.montarBackup(dados, new Date().toISOString()), null, 2), directory: 'CACHE', encoding: 'utf8' });
    await plugin('Share').share({ title: 'Backup da rotina', dialogTitle: 'Salvar ou enviar o backup', files: [r.uri] });
  }catch(e){
    if(!/cancel/i.test(String(e && (e.message || e)))) toast('Não foi possível exportar o backup');
  }
}
function exportar(){
  finalizarSnack();
  if(NATIVO){ exportarNativo(); return; }
  const arq = arquivoBackup();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(arq);
  a.download = arq.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Backup salvo em Downloads');
}
const podeCompartilhar = () => { if(NATIVO) return false; try{ return !!(navigator.canShare && navigator.canShare({ files: [new File(['{}'], 'x.json', { type: 'application/json' })] })); }catch(e){ return false; } };
async function compartilharBackup(){
  finalizarSnack();
  try{ await navigator.share({ files: [arquivoBackup()], title: 'Backup da rotina' }); }
  catch(e){ if(e && e.name !== 'AbortError') toast('Não foi possível compartilhar'); }
}
function importarBackup(){ finalizarSnack(); document.getElementById('arquivo').click(); }
document.getElementById('arquivo').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if(!f) return;
  let novo;
  try{ novo = Regras.lerBackup(await f.text()); }
  catch(err){ toast('Arquivo de backup inválido.'); return; }
  const atuais = Regras.contarTarefas(dados), doBackup = Regras.contarTarefas(novo);
  mostrarDialogo({
    titulo: `Substituir suas ${atuais} ${atuais === 1 ? 'tarefa' : 'tarefas'} pelas ${doBackup} do backup?`,
    cancelar: 'Cancelar', ok: 'Substituir', perigo: true,
    acao: () => {
      try{ localStorage.setItem('backup_pre_import', JSON.stringify(dados)); }
      catch(err){ toast('Não consegui guardar a cópia de segurança. Nada foi alterado.'); return; }
      dados = novo; ocultos.clear(); salvar(); render(); toast('Backup importado');
    },
  });
});

// quando o app volta do segundo plano num dia novo, atualiza o "Hoje"
let ultimoHoje = hoje();
function conferirDia(){
  if(hoje() === ultimoHoje) return;
  if(diaSel === ultimoHoje) diaSel = hoje();
  ultimoHoje = hoje();
  if(dados && !gesto) render();
}
function agendarMeiaNoite(){
  const agora = new Date();
  const meiaNoite = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate() + 1, 0, 0, 1);
  setTimeout(() => { conferirDia(); agendarMeiaNoite(); }, meiaNoite - agora);
}
agendarMeiaNoite();
document.addEventListener('visibilitychange', () => { if(!document.hidden) conferirDia(); });

/* ---------- lembretes (só no APK) ---------- */
let reconcTimer = null;
function agendarReconciliacao(){ if(!NATIVO) return; clearTimeout(reconcTimer); reconcTimer = setTimeout(reconciliarLembretes, 300); }
async function permissaoNotif(){ try{ return (await plugin('LocalNotifications').checkPermissions()).display; }catch(e){ return 'denied'; } }
async function pedirPermissaoNotif(){
  const LN = plugin('LocalNotifications');
  let p = await permissaoNotif();
  if(p === 'prompt' || p === 'prompt-with-rationale'){ try{ p = (await LN.requestPermissions()).display; }catch(e){ p = 'denied'; } }
  if(p === 'granted') agendarReconciliacao();
  return p === 'granted';
}
let estadoNotifTexto = 'Verificando…';
async function atualizarEstadoNotif(){
  if(!NATIVO) return;
  const p = await permissaoNotif();
  const el = document.getElementById('estado-notif');
  estadoNotifTexto = p === 'granted' ? 'Ativadas' : 'Desativadas';
  if(el) el.textContent = estadoNotifTexto;
}
function abrirConfigNotif(){ plugin('Configuracoes').abrirNotificacoes().catch(() => toast('Abra as configurações do Android e ative as notificações do app.')); }
async function reconciliarLembretes(){
  const LN = plugin('LocalNotifications');
  try{
    if(await permissaoNotif() !== 'granted') return;
    const pend = await LN.getPending();
    if(pend.notifications.length) await LN.cancel({ notifications: pend.notifications.map(n => ({ id: n.id })) });
    const lista = Regras.lembretesPendentes(dados, Date.now()).slice(0, 100);
    if(!lista.length) return;
    let exato = false;
    try{ exato = (await LN.checkExactNotificationSetting()).exact_alarm === 'granted'; }catch(e){}
    await LN.schedule({ notifications: lista.map(n => ({
      id: n.id, title: n.title, body: n.body, channelId: 'lembretes', smallIcon: 'ic_stat_rotina',
      schedule: { at: new Date(n.at), allowWhileIdle: true }, isExactNotification: exato, extra: { tipo: n.tipo, ref: n.ref },
    })) });
  }catch(e){ console.error('Falha ao agendar lembretes:', e && e.message); }
}
function iniciarLembretes(){
  if(!NATIVO) return;
  const LN = plugin('LocalNotifications');
  LN.createChannel({ id: 'lembretes', name: 'Lembretes', description: 'Avisos das tarefas com horário', importance: 4, visibility: 1 }).catch(() => {});
  LN.addListener('localNotificationActionPerformed', () => {
    if(document.getElementById('overlay').classList.contains('show')) return;
    diaSel = hoje();
    if(tela !== 'rotina') irPara('rotina'); else render();
  });
  document.addEventListener('visibilitychange', () => { if(!document.hidden){ agendarReconciliacao(); if(tela === 'ajustes') atualizarEstadoNotif(); } });
  agendarReconciliacao();
}

// faz funcionar offline e permite instalar como app (no APK os arquivos já estão no aparelho)
if(!NATIVO && 'serviceWorker' in navigator){
  try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
}

function telaErro(){
  document.querySelector('nav.tabs').innerHTML = '';
  document.getElementById('app').innerHTML = `
    <div class="empty" role="alert">
      <p>Não foi possível carregar suas tarefas.</p>
      <button class="btn" onclick="iniciar()">Tentar novamente</button>
    </div>`;
}
function iniciar(){
  try{ dados = carregar(); }
  catch(e){ dados = null; console.error('Falha ao carregar os dados:', e && e.message); telaErro(); return; }
  if(history.state) history.replaceState(null, '');
  if(NATIVO) document.getElementById('arquivo').removeAttribute('accept');
  aplicarTema(); montarNav(); render();
  iniciarLembretes();
}
iniciar();
</script>
